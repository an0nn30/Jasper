# Jasper Light: a soft grey chrome around a white workspace, with Jasper Dark's steel-blue accent darkened for light
# backgrounds. The terminal keeps Jasper's light palette (One Light).
name = "Jasper Light"
dark = false
author = "Jasper"

[colors]
background = "#fafafa"
foreground = "#383a42"
accent = "#3d7aa8"
cursor = "#526fff"
selection = "#d5def5"

[colors.normal]
black = "#383a42"
red = "#e45649"
green = "#50a14f"
yellow = "#c18401"
blue = "#4078f2"
magenta = "#a626a4"
cyan = "#0184bc"
white = "#a0a1a7"

[colors.bright]
black = "#696c77"
red = "#ca4035"
green = "#3d7d3b"
yellow = "#986801"
blue = "#315fc4"
magenta = "#87218b"
cyan = "#006b96"
white = "#ffffff"

[tokens]
surface = "#f3f4f6"
