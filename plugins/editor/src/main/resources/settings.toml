# Editor settings. Change them in Settings > Tools > Editor or here; changes apply at once to open tabs.

# The editor font; it must be an installed family. Default: the first installed of
# JetBrains Mono, Menlo, Consolas and DejaVu Sans Mono, else Monospaced.
# font_family = "JetBrains Mono"

# Font size in finite fractional points, 6 to 72.
# font_size = 13

# Ordered fallback families, shaped ligatures, and natural line-height multiplier (0.5 to 3.0).
# font_fallback = []
# font_ligatures = false
# font_line_height = 1.0

# Follow saved terminal typography across windows, preserving the independent values above.
# follow_terminal_font = false

# The Editor's colours: workspace (the editor scheme of the theme the workspace shows, Dark or Light), or one
# installed theme's scheme whatever the appearance, as <theme id>/dark or <theme id>/light, such as
# "catppuccin-mocha/dark". A scheme that is not installed shows the workspace's.
# color_scheme = "workspace"

# Initial mode for new Markdown tabs: source, split, preview. Explicit toolbar choices update this value.
# markdown_view_mode = "source"

# Columns per tab stop, 1 to 16.
# tab_size = 4

# Wrap long lines in new tabs.
# soft_wrap = false

# Files larger than this many MiB (1 to 256) are refused.
# max_file_mib = 10

# Vim mode: modal editing as in IdeaVim. The Vim item in the status bar and Toggle Vim Mode set this.
# vim = false

# Forget recent files not opened for this many days, 0 to 365; 0 keeps no recent files.
# recent_files_days = 30

# The default editor: jasper (the Jasper Editor), system (your system's default app; Jasper's shells get no EDITOR
# or VISUAL), custom (custom_command below) or an installed editor's id: nvim, vim, vi, nano, micro, helix, emacs,
# code, cursor, zed, sublime, bbedit, textmate, idea, notepadpp or notepad. Files Jasper opens, such as config.toml,
# open in it, and Jasper's shells get EDITOR for it.
# default_editor = "jasper"

# For custom: the command line, run by /bin/sh with Jasper's PATH plus /opt/homebrew/bin, /usr/local/bin and
# ~/.local/bin, or by cmd on Windows; the file's path is added at the end.
# custom_command = ""

# For custom: run the command in a terminal tab; false starts it on its own.
# custom_in_terminal = true

# When Jasper itself was started with EDITOR or VISUAL set, leave both alone in its shells.
# keep_environment_editor = true
