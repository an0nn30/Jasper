id = "dev.jasper.editor"
name = "Editor"
version = "0.18.0"
entry = "dev.jasper.editor.EditorPlugin"
sdk = ">=0.24.0, <0.25"
description = "Edit local and remote text files in tabs, with syntax highlighting."
vendor = "Jasper"
icon_hue = "neutral"
icon_selected_ink = "foreground"
icon = "icons/editor.svg"
capabilities = ["palette.contribute", "terminal.environment", "editor.provide", "terminal.open", "terminal.observe"]
exports = ["dev.jasper.editor.api"]

[[subcommands]]
name = "editor"
summary = "Open files in Jasper's Editor"
