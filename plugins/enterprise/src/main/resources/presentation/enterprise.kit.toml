kit = 1
base = "classic"

[chrome]
title_bar = "native"
menu_bar = "window"
window_title = "Workstation — {session} — {directory}"
tool_windows = "stripes"
editor_tabs = "classic"
status_bar = "cells"
palette = "run_window"
dialogs = "classic"
motion = "none"
icons = "classic"

[controls]
toggle = "checkbox"
exclusive = "radios"
tabs = "folder"
group = "titled_box"
form_label = "colon"
empty = "text"
table = "classic"
tree = "classic"
stepper = "spinner"
ordered_list = "side_column"
buttons = "classic"
tag = "boxed"
route = "edged"
prompt = "plain"

[metrics]
control_height = 22
row_height = 22
control_radius = 3
field_radius = 2
group_radius = 3
focus_ring = 2
tool_window_header = 24
group_padding = 12
dependent_indent = 20
navigation_width = 230
status_dot = 7

[type]
base = 12

[type.ui]
family = "IBM Plex Sans"
regular = "fonts/ibm-plex-sans-regular.ttf"
medium = "fonts/ibm-plex-sans-medium.ttf"
semibold = "fonts/ibm-plex-sans-semibold.ttf"

[type.data]
family = "IBM Plex Mono"
regular = "fonts/ibm-plex-mono-regular.ttf"
medium = "fonts/ibm-plex-mono-medium.ttf"

[colors]
dialog_surface = "surface.app"
navigation_surface = "surface.card"

[branding]
product = "JasperOps"
icons = "icons"
splash_art = "splash/art.svg"

[defaults]
"ui.theme.light" = "enterprise"
"ui.theme.dark" = "enterprise"
"palette.visible_rows" = 8
"window.toolbar_height" = 34
