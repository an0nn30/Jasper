id = "dev.jasper.indexer"
name = "Project Index"
version = "0.2.0"
entry = "dev.jasper.indexer.IndexerPlugin"
sdk = ">=0.15.2, <0.16"
description = "Offers to index the project a terminal enters, locally or on Remote's saved hosts, and finds its files from the command palette's Files tab, opening them in the Editor; folders can also be indexed by hand."
vendor = "Jasper"
icon_hue = "neutral"
icon_selected_ink = "foreground"
icon = "icons/indexer.svg"
homepage = "https://github.com/an0nn30/Jasper"
capabilities = ["terminal.observe", "terminal.open", "palette.contribute"]
requires = [{ id = "dev.jasper.editor", version = ">=0.7", optional = true }, { id = "dev.jasper.remote", version = ">=0.12", optional = true }]
