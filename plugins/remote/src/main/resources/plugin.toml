id = "dev.jasper.remote"
name = "Remote"
version = "0.3.0"
entry = "dev.jasper.remote.RemotePlugin"
sdk = ">=0.7.6, <0.8"
description = "SSH and SFTP: browsing, persistent file transfers, and saved hosts with groups and favorites, managed Vault imports and optional SSH-agent authentication, ProxyJump, host-key trust, a hosts panel and a palette scope."
vendor = "Jasper"
capabilities = ["terminal.open", "session.provide", "terminal.observe", "palette.contribute"]
requires = [{ id = "dev.jasper.vault", version = ">=0.2", optional = true }]
