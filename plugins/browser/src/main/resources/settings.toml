# Settings for the Browser plugin. Change them in Settings > Tools > Browser or here. Most changes apply to pages and links opened afterwards; ad blocking, the filter list and the proxy apply at once.
# start_page = "jasper-about:welcome"   # what a new browser tab, window or pane opens: a web address, or Jasper's welcome page
# page_zoom = 100                       # the zoom web pages show at until you zoom them, and that Reset Font Size returns to: 25 to 500 (%)
# downloads_folder = ""                 # where downloaded files go, without asking: an absolute folder, ~ or ~/folder; empty uses the system's Downloads folder
# open_links_from_terminal = "ask"      # where a web link you open goes: ask, builtin (Jasper's browser) or default (the system's browser)
# open_local_web_files = "ask"          # where a local web file clicked in a terminal goes: ask, builtin (Jasper's browser) or editor (the Default editor)
# search_engine = "google"              # what the address field searches with and suggests from: google, duckduckgo, bing, kagi or custom
# custom_search_url = ""                # with custom: a search's http(s) results address, with %s for the terms, such as "https://search.example.com/?q=%s"
# custom_suggestions_url = ""           # with custom: an http(s) OpenSearch suggestions address, with %s for the typed text; empty shows none
# devnull_mode = false                  # true: browser tabs, windows and panes opened afterwards keep cookies, history and all other data in memory only
# ad_blocking = false                   # true: block ads and hide the parts of pages that show them, as the filter list below says
# filter_list_url = "https://easylist-downloads.adblockplus.org/easylist_content_blocker.json"   # a WebKit content blocker list: an https address, or http on this computer; downloaded every 24 hours
# http_proxy = false                    # true: route browser traffic through the proxy below, and the browser's own favicon, suggestion, View Source and filter list fetches too
# proxy_host = "127.0.0.1"              # the proxy server's host name or IP address; an IPv6 address without brackets
# proxy_port = 8118                     # the proxy server's port: 1 to 65535
