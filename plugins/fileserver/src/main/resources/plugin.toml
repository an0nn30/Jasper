id = "dev.jasper.fileserver"
name = "File Server"
version = "0.4.0"
entry = "dev.jasper.fileserver.FileServerPlugin"
sdk = ">=0.15.4, <0.16"
description = "Share a local folder with other computers over HTTP, HTTPS, FTP, FTPS, SFTP or TFTP: named servers in a File Servers panel, read-only and local-only by default, with an activity log, Vault logins and Serve Current Folder."
vendor = "Jasper"
icon_hue = "blue"
icon_selected_ink = "foreground"
icon = "icons/fileserver.svg"
homepage = "https://github.com/an0nn30/Jasper"
capabilities = ["network.listen", "terminal.observe", "palette.contribute"]
requires = [{ id = "dev.jasper.vault", version = ">=0.2", optional = true }]
