# Test-only Desktop workspace chrome calibration (title bar, tabs, rails, status, dock gutters and panels).
# Sampled at original pixels from Screenshot 2026-10-06 at 11.16.25/41/50 AM (2x): chrome #25292f, terminal #222629,
# title field #262a30 with #343a42 outline, panel #191c20, selection #304e77, text #d5dee5/#a7b2bf, success #a9c58c.
# Panel-family roles follow desktop-sessions.toml so the integrated capture shares the Sessions calibration.
name = "Desktop Workspace Calibration"
dark = true
[colors]
background = "#222629"
foreground = "#d5dee5"
accent = "#3373f6"
[semantic]
"surface.app" = "#25292f"
"surface.status" = "#25292f"
"surface.sidebar" = "#25292f"
"surface.terminal" = "#222629"
"surface.dialog" = "#1f232b"
"surface.panel" = "#191c20"
"surface.panel.raised" = "#21252a"
"surface.card" = "#1b1d22"
"surface.input" = "#191c20"
"surface.control" = "#2d3238"
"surface.control.hover" = "#30353f"
"surface.menu" = "#2a2f38"
"border.window" = "#343a42"
"border.input" = "#343a42"
"border.control" = "#3b414d"
"border.subtle" = "#343a42"
"border.menu" = "#343a42"
"border.focus" = "#3373f6"
"text.primary" = "#d5dee5"
"text.secondary" = "#a7b2bf"
"text.tertiary" = "#7e8491"
"text.placeholder" = "#8b929f"
"text.onAccent" = "#ffffff"
"text.onAccent.secondary" = "#c1cad6"
"selection.bg" = "#304e77"
"segment.selected.bg" = "#4d535f"
"status.success" = "#a9c58c"
"status.warning" = "#f5be3e"
"status.idle" = "#4a515c"
"hue.blue" = "#9fc5ff"
"hue.neutral" = "#ced0d6"
"hue.neutral.surface" = "#69737d"
"toggle.knob" = "#ffffff"
"button.secondary.bg" = "#2d323c"

[colors.normal]
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"

[colors.bright]
black = "#6272a4"
red = "#ff6e6e"
green = "#69ff94"
yellow = "#ffffa5"
blue = "#d6acff"
magenta = "#ff92df"
cyan = "#a4ffff"
white = "#ffffff"
