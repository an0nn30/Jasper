# Clear Light, ported from the macOS Terminal.app profile of the same name: a translucent, blurred workspace.
# Terminal.app's bold-text colour (#313c44) and font (SF Mono 12) are not theme values in Jasper.
name = "Clear Light"
dark = false
author = "Jasper"
source = "macOS Terminal.app, Clear Light profile"

[colors]
background = "#ffffff"
foreground = "#3a4851"
accent = "#49a2e1"
cursor = "#919191"
selection = "#e5ecf1"

[colors.normal]
black = "#2d3840"
red = "#b45648"
green = "#6caa71"
yellow = "#c4ac62"
blue = "#5685a8"
magenta = "#ad64be"
cyan = "#69c6c9"
white = "#c1c8cc"

[colors.bright]
black = "#506573"
red = "#df6c5a"
green = "#79be7e"
yellow = "#e5c872"
blue = "#49a2e1"
magenta = "#d389e5"
cyan = "#77e1e5"
white = "#d8e1e7"

[workspace]
opacity = 0.93
blur = 0.5
