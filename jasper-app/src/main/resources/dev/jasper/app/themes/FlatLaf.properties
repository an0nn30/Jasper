# Shared shape and semantic defaults; palette values live in the per-theme files.
Component.arc = 4
# Compact form controls have their own geometry; WindowChrome keeps its toolbar styling.
Button.arc = 4
TextComponent.arc = 0
ComboBox.padding = 3,6,4,6
ComboBox.background = $Jasper.comboBackground
ComboBox.buttonBackground = $Jasper.comboBackground
TextArea.margin = 4,8,4,8
TextArea.background = $Jasper.controlBackground
TextField.margin = 3,6,4,6
PasswordField.margin = 3,6,4,6
FormattedTextField.margin = 3,6,4,6
TextField.background = $Jasper.controlBackground
PasswordField.background = $Jasper.controlBackground
FormattedTextField.background = $Jasper.controlBackground
ButtonUI = dev.jasper.app.appearance.BrandedButtonUI
Button.margin = 2,14,2,14
Button.minimumWidth = 72
Button.background = $Jasper.buttonBackground
Button.foreground = $Jasper.buttonForeground
Button.borderColor = $Jasper.buttonBorder
Button.hoverBackground = $Button.toolbar.hoverBackground
Button.pressedBackground = $Button.toolbar.pressedBackground
Button.focusedBackground = $Jasper.buttonBackground
Button.default.background = $Jasper.accentBackground
Button.default.foreground = #ffffff
Button.default.borderColor = $Jasper.accentBackground
Button.default.hoverBackground = lighten($Jasper.accentBackground,5%)
Button.default.pressedBackground = darken($Jasper.accentBackground,5%)
Button.default.focusedBackground = $Jasper.accentBackground
Button.default.boldText = true
Component.borderColor = @jasperBorder
Component.disabledBorderColor = @jasperBorder
Component.focusedBorderColor = @accentColor
Separator.foreground = @jasperBorder
SplitPane.dividerSize = 8
SplitPaneDivider.border = dev.jasper.app.workspace.SplitDividerBorder
SplitPaneDivider.gripColor = $Jasper.chromeForeground
SplitPaneDivider.hoverColor = @jasperHover
SplitPaneDivider.pressedColor = @selectionBackground
PopupMenu.borderColor = @jasperBorder
ToolBar.background = $Jasper.titleBackground
MenuBar.background = $Jasper.titleBackground
TabbedPane.background = $Jasper.titleBackground
TabbedPane.selectedBackground = @background
TabbedPane.selectedForeground = @foreground
TabbedPane.hoverColor = @jasperHover
TabbedPane.focusColor = @jasperHover
TabbedPane.contentAreaColor = @jasperBorder
Button.toolbar.hoverBackground = @jasperHover
Button.toolbar.pressedBackground = @selectionBackground
Button.toolbar.selectedBackground = @selectionBackground
TitlePane.background = $Jasper.titleBackground
TitlePane.foreground = $Jasper.titleForeground
TitlePane.inactiveForeground = $Jasper.titleInactiveForeground
Jasper.paletteBackground = $Jasper.tabSelectedBackground
Jasper.paletteForeground = $Jasper.chromeForeground
Jasper.paletteMutedForeground = $Jasper.mutedForeground
Jasper.paletteBorder = $Component.borderColor
Jasper.paletteAccent = $Component.focusedBorderColor
Jasper.paletteSelectionBackground = @selectionBackground
Jasper.paletteSelectionForeground = @selectionForeground

# TermLab form palette; selected rows and combo popups use its muted blue highlight.
Panel.background = $Jasper.formBackground
List.background = $Jasper.formListBackground
List.selectionBackground = #5E7293
List.selectionForeground = #ffffff
List.selectionInactiveBackground = #5E7293
List.selectionInactiveForeground = #ffffff
ComboBox.selectionBackground = #5E7293
ComboBox.selectionForeground = #ffffff
ComboBox.popupInsets = 0,0,0,0
ComboBox.buttonArrowColor = $Label.foreground
ComboBox.buttonStyle = button
Component.arrowType = triangle
Button.paintShadow = false

# Reference UI typography (logical points; FlatLaf applies display scaling).
Label.font = -1 $defaultFont
List.font = -1 $defaultFont
TextField.font = -1 $defaultFont
PasswordField.font = -1 $defaultFont
FormattedTextField.font = -1 $defaultFont
TextArea.font = -1 $defaultFont
ComboBox.font = -1 $defaultFont

List.foreground = $Label.foreground
TextField.foreground = $Label.foreground
PasswordField.foreground = $Label.foreground
FormattedTextField.foreground = $Label.foreground
TextArea.foreground = $Label.foreground
ComboBox.foreground = $Label.foreground
