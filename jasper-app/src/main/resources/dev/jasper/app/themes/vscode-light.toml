"name" = "Code Light"
"dark" = false
"ui_complete" = true
"author" = "Dinesh Srinivasan"
"license" = "BSD-2-Clause"
"source" = "https://github.com/dinbtechit/vscode-theme"
"commit" = "3704464217ce81fe3742b9c2407de0ba34482d5e"

[colors]
"background" = "#ffffff"
"foreground" = "#000000"
"accent" = "#0000ff"
"cursor" = "#000000"
"selection" = "#a6d2ff"

[colors.normal]
"black" = "#000000"
"red" = "#ff0000"
"green" = "#008000"
"yellow" = "#ffcc00"
"blue" = "#0000ff"
"magenta" = "#ff00ff"
"cyan" = "#00b2b2"
"white" = "#595959"

[colors.bright]
"black" = "#656565"
"red" = "#ff1616"
"green" = "#16b42c"
"yellow" = "#ecc32c"
"blue" = "#2d61f0"
"magenta" = "#e617e6"
"cyan" = "#15c1c1"
"white" = "#c9c9c9"

[tokens]
"selection" = "#d4e2ff"
"selection_text" = "#000000"
"selection_inactive" = "#dfe1e5"
"text_selection" = "#d4e2ff"
"text_selection_text" = "#000000"

[syntax]
"keyword" = { color = "#0000ff", bold = true, italic = false }
"type" = { color = "#277f99", bold = false, italic = false }
"function" = { color = "#795e26", bold = false, italic = false }
"variable" = { color = "#3b3b3b", bold = false, italic = false }
"constant" = { color = "#3b3b3b", bold = false, italic = false }
"number" = { color = "#098658", bold = false, italic = false }
"string" = { color = "#a31515", bold = true, italic = false }
"comment" = { color = "#008000", bold = false, italic = true }
"doc_comment" = { color = "#008000", bold = false, italic = true }
"annotation" = { color = "#3b3b3b", bold = false, italic = false }
"operator" = { color = "#000000", bold = false, italic = false }
"tag" = { color = "#800000", bold = false, italic = false }
"attribute" = { color = "#e50000", bold = false, italic = false }

