"name" = "Code Dark"
"dark" = true
"ui_complete" = true
"author" = "Dinesh Srinivasan"
"license" = "BSD-2-Clause"
"source" = "https://github.com/dinbtechit/vscode-theme"
"commit" = "3704464217ce81fe3742b9c2407de0ba34482d5e"

[colors]
"background" = "#171616"
"foreground" = "#ffffff"
"accent" = "#206de3"
"cursor" = "#adaeac"
"selection" = "#264e77"

[colors.normal]
"black" = "#000000"
"red" = "#c91b00"
"green" = "#48d53b"
"yellow" = "#c7c400"
"blue" = "#005cbb"
"magenta" = "#c930c7"
"cyan" = "#60fdff"
"white" = "#c9c9c9"

[colors.bright]
"black" = "#686868"
"red" = "#ff4050"
"green" = "#5ffa68"
"yellow" = "#fffc67"
"blue" = "#6871ff"
"magenta" = "#ff77ff"
"cyan" = "#60fdff"
"white" = "#ffffff"

[tokens]
"surface" = "#323333"
"surface_raised" = "#323333"
"surface_sunken" = "#323333"
"status_bar" = "#323333"
"sidebar" = "#1e1e1e"
"text_disabled" = "#737374"
"text_on_accent" = "#dde9fa"
"separator" = "#5a5b5c"
"focus_ring" = "#24648d"
"selection_inactive" = "#555657"
"tab_bar" = "#323333"
"input_background" = "#323333"
"button_background" = "#424242"
"button_border" = "#525252"
"button_text" = "#dfdfe0"
"button_default" = "#206de3"

[syntax]
"keyword" = { color = "#47a2ed", bold = true, italic = false }
"type" = { color = "#47ccb1", bold = false, italic = false }
"function" = { color = "#e6e6aa", bold = false, italic = false }
"variable" = { color = "#94dbfd", bold = false, italic = false }
"constant" = { color = "#4fc1ff", bold = true, italic = false }
"number" = { color = "#b4cda8", bold = false, italic = false }
"string" = { color = "#cd9069", bold = true, italic = false }
"comment" = { color = "#699856", bold = false, italic = true }
"doc_comment" = { color = "#6a9955", bold = false, italic = true }
"annotation" = { color = "#47ccb1", bold = false, italic = false }
"punctuation" = { color = "#cc7832", bold = false, italic = false }
"tag" = { color = "#808080", bold = false, italic = false }
"attribute" = { color = "#8cd7ff", bold = false, italic = false }

[ui]
"*.background" = "#323333"
"*.foreground" = "#DFDFE0"
"*.infoForeground" = "#A9A9AA"
"*.selectionInactiveBackground" = "#555657"
"*.selectionBackgroundInactive" = "#555657"
"*.lightSelectionBackground" = "#2B4059"
"*.lightSelectionForeground" = "#FFFFFF"
"*.lightSelectionInactiveBackground" = "#555657"
"*.lightSelectionInactiveForeground" = "#DFDFE0"
"*.disabledBackground" = "#323333"
"*.inactiveBackground" = "#313233"
"*.disabledForeground" = "#737374"
"*.disabledText" = "#737374"
"*.inactiveForeground" = "#737374"
"*.acceleratorForeground" = "#D0D0D9"
"*.acceleratorSelectionForeground" = "#D0D0D9"
"*.borderColor" = "#414141"
