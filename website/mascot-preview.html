<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jasper — mascot preview</title>
<style>body{background:#faf9f5;color:#302f28;font:16px system-ui;margin:40px auto;max-width:960px;padding:0 24px}a{color:#1a73e8}h1{font-size:36px;letter-spacing:-1px}p{color:#676b5c;line-height:1.6}.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:20px}.frame{background:#f3f2e9;border-radius:16px;padding:18px 8px;text-align:center}.sprite{width:105px;height:120px;background-image:url('assets/jasper-app-pixel-sprites.png');background-size:2100px 120px;image-rendering:pixelated;margin:auto}.demo{display:flex;align-items:center;gap:28px;margin:32px 0}.demo .sprite{margin:0}button{background:#1a73e8;color:white;border:0;padding:10px 18px;border-radius:8px;cursor:pointer}small{display:block;margin-top:12px;color:#676b5c}</style>
<a href="/">← Homepage</a><h1>Jasper, in pixels.</h1><p>The app’s approved pixel sprites at their new 105 × 120 default size. Crisp edges, stepped shading, and the same familiar poses. The homepage mascot keeps its existing illustration.</p>
<div class="demo"><div class="sprite" id="animated" role="img" aria-label="Jasper blinking and waving"></div><button id="motion">Pause animation</button></div><div class="frames" id="frames"></div>
<script>
const names=['Idle','Blink','Wink','Wave A','Wave B','Hop','Lean left','Lean right','Sit','Sit blink','Tuck','Sleep A','Sleep B','Sleep C','Sparkle A','Sparkle B','Sparkle C','Type A','Type B','Type rest'];
const grid=document.querySelector('#frames'); names.forEach((name,i)=>{const card=document.createElement('div');card.className='frame';const art=document.createElement('div');art.className='sprite';art.style.backgroundPosition=`${-105*i}px 0`;art.role='img';art.ariaLabel=name;const label=document.createElement('small');label.textContent=name;card.append(art,label);grid.append(card)});
const sequence=[0,0,0,0,1,0,0,3,4,3,4,3,0,0,0,0];let index=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;const button=document.querySelector('#motion');const updateLabel=()=>button.textContent=playing?'Pause animation':'Play animation';updateLabel();button.onclick=()=>{playing=!playing;updateLabel()};setInterval(()=>{if(playing&&!document.hidden)document.querySelector('#animated').style.backgroundPosition=`${-105*sequence[index++%sequence.length]}px 0`},250);
</script></html>
