name: linux-packages

# jpackage builds only for the machine it runs on, so each architecture is packaged on its own native
# runner. Ubuntu 22.04 keeps the detected .deb dependencies on their pre-t64 names, which Debian 12 has
# and newer releases still provide. Each package is then installed into disposable containers of other
# distributions to prove its dependencies resolve there.
on:
  push:
    branches: [main]
    paths:
      - gradle/packaging.gradle
      - gradle/packaging-support.gradle
      - gradle/linux-desktop-colors.gradle
      - gradle.properties
      - build.gradle.kts
      - settings.gradle.kts
      - jasper-app/src/main/java/dev/jasper/app/platform/**
      - jasper-app/src/test/java/dev/jasper/app/platform/**
      - jasper-app/src/main/resources/dev/jasper/app/about/licenses/notices.toml
      - jasper-app/build.gradle.kts
      - packaging/**
      - .github/workflows/linux-packages.yml
      - .github/workflows/desktop-qt-sdk.yml
  pull_request:
    paths:
      - gradle/packaging.gradle
      - gradle/packaging-support.gradle
      - gradle/linux-desktop-colors.gradle
      - gradle.properties
      - build.gradle.kts
      - settings.gradle.kts
      - jasper-app/src/main/java/dev/jasper/app/platform/**
      - jasper-app/src/test/java/dev/jasper/app/platform/**
      - jasper-app/src/main/resources/dev/jasper/app/about/licenses/notices.toml
      - jasper-app/build.gradle.kts
      - packaging/**
      - .github/workflows/linux-packages.yml
      - .github/workflows/desktop-qt-sdk.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    uses: ./.github/workflows/desktop-qt-sdk.yml
    with:
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.arch }}

  package:
    needs: desktop-sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      # The package version comes from the release tag, so the whole history and its tags are needed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm cpio binutils build-essential cmake pkg-config libglib2.0-dev libglib2.0-bin libxtst6 libasound2 dbus-daemon libxcb1 libxcb-render0 libxau6 libxcb1-dev libxcb-render0-dev libxau-dev
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: desktop-qt-sdk-${{ matrix.arch }}
      - name: Select baseline SDKs
        run: |
          tar -xzf desktop-qt-sdk.tar.gz
          printf '\njasper.qt5Prefix=%s/.desktop-qt-sdk/prefixes/qt5\njasper.qt6Prefix=%s/.desktop-qt-sdk/prefixes/qt6\njasper.kf5Prefix=%s/.desktop-qt-sdk/prefixes/kf5\njasper.kde6QtPrefix=%s/.desktop-qt-sdk/prefixes/kde6-qt\njasper.kf6Prefix=%s/.desktop-qt-sdk/prefixes/kf6\n' "$PWD" "$PWD" "$PWD" "$PWD" "$PWD" >> gradle.properties
      - name: Require Linux tray wire, ABI and cancellation gates
        run: |
          ./gradlew :jasper-app:test --tests '*LinuxTrayTransportTest' --tests '*LinuxTrayWireTest' --tests '*LinuxStatusNotifierTest'
          ./gradlew :jasper-app:linuxTrayNativeTest --tests '*LinuxTrayXcbTest' --tests '*LinuxLegacyTrayTest'
          ./gradlew :jasper-app:linuxX11TrayProbe --args='--gate transport --require-native --output build/tray-gate/transport'
          python3 - <<'PYTHON'
          import pathlib, xml.etree.ElementTree as ET
          roots = [pathlib.Path('jasper-app/build/test-results') / name for name in ('test', 'linuxTrayNativeTest')]
          for root in roots:
              reports = list(root.glob('TEST-*.xml'))
              assert reports, f'Missing required reports: {root}'
              for report in reports:
                  suite = ET.parse(report).getroot()
                  assert int(suite.attrib['tests']) > 0, report
                  assert all(int(suite.attrib.get(key, 0)) == 0 for key in ('failures', 'errors', 'skipped')), report
          PYTHON
      - name: Package and build native fixtures at baseline
        run: ./gradlew :jasper-app:packageDist :jasper-app:compileDesktopQtNativeTests -Pjasper.python=/usr/bin/python3 --max-workers=2 --stacktrace
      - name: Require exact packaged tray runtime
        run: |
          image="$PWD/jasper-app/build/packaging/image/Jasper"
          ./gradlew :jasper-app:linuxX11TrayProbe -Pjasper.tray.packagedHome="$image" --args='--gate transport --require-native --output build/tray-gate/packaged-transport'
          timeout 60 ./gradlew :jasper-app:linuxX11TrayProbe -Pjasper.tray.packagedHome="$image" --args='--gate bus --require-native --output build/tray-gate/packaged-bus'
          cat /etc/os-release
          uname -m
          "$image/lib/runtime/bin/java" -version
          dbus-daemon --version
          dpkg-query -W libxcb1 libxcb-render0 libxau6 libc6
          sha256sum "$image"/lib/app/*.jar "$image/lib/runtime/bin/java"
          for library in libxcb.so.1 libxcb-render.so.0 libXau.so.6; do
            resolved=$(ldconfig -p | awk -v library="$library" '$1 == library && !found { print $NF; found=1 }')
            test -n "$resolved"
            readelf -h -d -V "$resolved"
            ldd "$resolved"
          done
      - name: Archive exact release helpers and matching native fixtures
        run: tar -czf desktop-native-tests.tar.gz jasper-app/build/desktop-colors/cmake jasper-app/build/desktop-helpers
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-native-tests-${{ matrix.arch }}
          path: desktop-native-tests.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: jasper-linux-${{ matrix.arch }}
          path: |
            jasper-app/build/packaging/dist/*.deb
            jasper-app/build/packaging/dist/*.rpm
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jasper-linux-${{ matrix.arch }}-tray-gate
          path: |
            jasper-app/build/tray-gate/
            jasper-app/build/test-results/
            jasper-app/build/linux-tray-wire/
          if-no-files-found: ignore
      # A failed package task keeps its jpackage work directory for diagnosis.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jasper-linux-${{ matrix.arch }}-work
          path: jasper-app/build/packaging/*-work
          include-hidden-files: true
          if-no-files-found: ignore

  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, aarch64]
        distro: ['debian:12', 'ubuntu:24.04', 'fedora:latest', 'opensuse/tumbleweed']
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jasper-linux-${{ matrix.arch }}
          path: dist
      - name: Install, check and remove
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          case "$DISTRO" in debian*|ubuntu*) type=deb ;; *) type=rpm ;; esac
          package=$(cd dist && ls ./*."$type")
          docker run --rm -v "$PWD:/work:ro" "$DISTRO" sh /work/packaging/linux/check-install.sh "/work/dist/${package#./}"

  desktop-native-runtime:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, aarch64]
        runtime: ['ubuntu:22.04', 'fedora:44']
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: desktop-native-tests-${{ matrix.arch }}
      - uses: actions/download-artifact@v8
        with:
          name: jasper-linux-${{ matrix.arch }}
          path: jasper-dist
      - name: Run exact baseline-built fixtures on installed system runtimes
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          tar -xzf desktop-native-tests.tar.gz
          docker run --rm -v "$PWD:$PWD" -w "$PWD" "$RUNTIME" sh packaging/desktop-colors/test/check-runtime.sh
