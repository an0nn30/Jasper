name: ci

# A push or pull request that changes only documentation runs nothing: every run is billed against the account's
# Actions minutes (macOS ten times, Windows twice), and ./gradlew check, which also checks the docs, runs before
# every merge. The example external plugin under docs/examples is code and still runs.
on:
  push:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/examples/**'
      - '!**/*.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/examples/**'
      - '!**/*.md'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # A full run takes about five minutes; a hang should not hold the runner for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v6
      - name: Linux desktop probe dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libgtk-4-dev libadwaita-1-dev xvfb xauth dbus
      - name: Check
        shell: bash
        run: ./gradlew check --continue --stacktrace
      # check built the release jars; the example plugin must keep building from them.
      - name: Example external plugin
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew -p docs/examples/external-plugin -PjasperSdkDir="$PWD/build/sdk-release" check pluginZip --stacktrace

  desktop-gtk-modern:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
    timeout-minutes: 20
    steps:
      - name: Modern toolkit dependencies
        run: apt-get update && apt-get install -y ca-certificates git build-essential pkg-config libglib2.0-dev libgtk-3-dev libgtk-4-dev libadwaita-1-dev xvfb xauth dbus
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: GTK 4.16+ native extraction gate
        run: |
          echo 'Ubuntu 26.04 image index: sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944'
          cat /etc/os-release
          pkg-config --modversion gtk+-3.0 gtk4 libadwaita-1
          pkg-config --atleast-version=4.16 gtk4
          ./gradlew :jasper-app:testDesktopGtk --console=plain --stacktrace
