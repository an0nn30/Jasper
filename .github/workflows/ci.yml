name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A full run takes about five minutes; a hang should not hold the runner for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check
        shell: bash
        run: ./gradlew check --continue --stacktrace
      # check built the release jars; the example plugin must keep building from them.
      - name: Example external plugin
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew -p docs/examples/external-plugin -PjasperSdkDir="$PWD/build/sdk-release" check pluginZip --stacktrace
