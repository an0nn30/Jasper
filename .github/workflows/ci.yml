name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check
        shell: bash
        run: ./gradlew check --stacktrace
