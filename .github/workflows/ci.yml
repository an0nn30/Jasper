name: ci

# Test PRs and main only; documentation-only changes remain excluded.
# The example external plugin under docs/examples is code and still runs.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/examples/**'
      - '!**/*.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/examples/**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-sdk:
    uses: ./.github/workflows/desktop-qt-sdk.yml
    with:
      runner: ubuntu-22.04
      architecture: x64

  check:
    needs: desktop-sdk
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Full Windows checks take about 20 minutes; bound hangs while retaining time for diagnostics.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-jbr
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test pinned JBR installer
        if: runner.os == 'Linux'
        run: python3 .github/actions/setup-jbr/test_install.py
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Linux fonts and desktop probe dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-cjk build-essential pkg-config libglib2.0-dev libgtk-3-dev libgtk-4-dev libadwaita-1-dev xvfb xauth dbus locales
          sudo localedef -i de_DE -f UTF-8 de_DE.UTF-8
      - uses: actions/download-artifact@v8
        if: runner.os == 'Linux'
        with:
          name: desktop-qt-sdk-x64
      - name: Select baseline Qt SDKs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -xzf desktop-qt-sdk.tar.gz
          printf '\njasper.qt5Prefix=%s/.desktop-qt-sdk/prefixes/qt5\njasper.qt6Prefix=%s/.desktop-qt-sdk/prefixes/qt6\njasper.kf5Prefix=%s/.desktop-qt-sdk/prefixes/kf5\njasper.kde6QtPrefix=%s/.desktop-qt-sdk/prefixes/kde6-qt\njasper.kf6Prefix=%s/.desktop-qt-sdk/prefixes/kf6\n' "$PWD" "$PWD" "$PWD" "$PWD" "$PWD" >> gradle.properties
      - name: Test Windows check watchdog
        if: runner.os == 'Windows'
        run: python .github/scripts/test_windows_check.py
      - name: Check
        shell: bash
        # Windows subprocess/cleanup tests hit deadlines with concurrent test JVMs.
        # Keep its worker count at one; Unix runners parallelize independent projects.
        # Each project keeps its default single test JVM and sequential JUnit execution.
        env:
          GRADLE_WORKERS: ${{ runner.os == 'Windows' && '1' || '2' }}
        run: |
          # Leave four minutes of the job budget for bounded snapshots and artifact upload.
          if [ "$RUNNER_OS" = Windows ]; then
            python .github/scripts/windows_check.py --timeout 1560 --capture-at 900 --capture-at 1440 --diagnostics build/ci-jvm-diagnostics -- cmd /c gradlew.bat check --parallel --max-workers="$GRADLE_WORKERS" --continue --stacktrace --console=plain --init-script .github/scripts/windows-test-progress.gradle
          else
            ./gradlew check --parallel --max-workers="$GRADLE_WORKERS" --continue --stacktrace
          fi
      # check built the release jars; the example plugin must keep building from them.
      - name: Example external plugin
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew -p docs/examples/external-plugin -PjasperSdkDir="$PWD/build/sdk-release" check pluginZip --stacktrace
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            build/ci-jvm-diagnostics/**
            **/build/test-results/**
            **/build/reports/tests/**
            jasper-app/build/enterprise-settings/**
            jasper-app/build/chrome-renders/**
          retention-days: 7

  desktop-gtk-modern:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
    timeout-minutes: 20
    steps:
      - name: Modern toolkit dependencies
        run: apt-get update && apt-get install -y ca-certificates curl git build-essential pkg-config libglib2.0-dev libgtk-3-dev libgtk-4-dev libadwaita-1-dev xvfb xauth dbus locales
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-jbr
      - uses: gradle/actions/setup-gradle@v6
      - name: GTK 4.16+ native extraction gate
        run: |
          echo 'Ubuntu 26.04 image index: sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944'
          localedef -i de_DE -f UTF-8 de_DE.UTF-8
          cat /etc/os-release
          pkg-config --modversion gtk+-3.0 gtk4 libadwaita-1
          pkg-config --atleast-version=4.16 gtk4
          ./gradlew :jasper-app:testDesktopProtocol :jasper-app:testDesktopPortal :jasper-app:testDesktopGtk :jasper-app:verifyDesktopGtkAbi --max-workers=2 --console=plain --stacktrace
