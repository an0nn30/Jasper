# Shared shape and semantic defaults; palette values live in the per-theme files.
Component.arc = 6
Button.arc = 6
Component.borderColor = @morayBorder
Component.disabledBorderColor = @morayBorder
Component.focusedBorderColor = @accentColor
Separator.foreground = @morayBorder
PopupMenu.borderColor = @morayBorder
ToolBar.background = @background
MenuBar.background = $Moray.titleBackground
TabbedPane.background = $Moray.titleBackground
TabbedPane.selectedBackground = @background
TabbedPane.selectedForeground = @foreground
TabbedPane.hoverColor = @morayHover
TabbedPane.focusColor = @morayHover
TabbedPane.contentAreaColor = @morayBorder
Button.toolbar.hoverBackground = @morayHover
Button.toolbar.pressedBackground = @selectionBackground
Button.toolbar.selectedBackground = @selectionBackground
TitlePane.background = $Moray.titleBackground
TitlePane.foreground = $Moray.titleForeground
TitlePane.inactiveForeground = $Moray.titleInactiveForeground
Moray.paletteBackground = $Moray.tabSelectedBackground
Moray.paletteForeground = $Moray.chromeForeground
Moray.paletteMutedForeground = $Moray.mutedForeground
Moray.paletteBorder = $Component.borderColor
Moray.paletteAccent = $Component.focusedBorderColor
Moray.paletteSelectionBackground = @selectionBackground
Moray.paletteSelectionForeground = @selectionForeground
