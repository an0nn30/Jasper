# Moray Dark Purple — Eclipse-inspired terminal palette.
# Built into Moray: select colors.theme = "moray-dark-purple"; no theme file is needed.
# This complete Alacritty-compatible subset is a reference for reuse or customization.

[colors.primary]
background = "#120c1c"
foreground = "#bcc2d2"

[colors.cursor]
cursor = "#ffffff"

[colors.selection]
background = "#492b61"

[colors.normal]
black = "#241532"
red = "#ed7c96"
green = "#9ccf9a"
yellow = "#e6c07a"
blue = "#8eaff0"
magenta = "#c089ef"
cyan = "#75c6d2"
white = "#bcc2d2"

[colors.bright]
black = "#91819d"
red = "#ff97ae"
green = "#b6e3ae"
yellow = "#f4d69b"
blue = "#b2c6ff"
magenta = "#d4a6ff"
cyan = "#97dce6"
white = "#ffffff"
