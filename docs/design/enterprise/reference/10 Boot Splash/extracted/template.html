<div style="min-height:100vh;display:flex;flex-direction:column;align-items:{{ align }};justify-content:{{ justify }};gap:28px;padding:{{ pad }};box-sizing:border-box">
  <div data-screen-label="Boot Splash" style="width:720px;height:440px;position:relative;box-sizing:border-box;background:linear-gradient(180deg,#17346F 0%,#102552 100%);border:1px solid #8A8F96;box-shadow:{{ shadow }};overflow:hidden;opacity:{{ opacity }};transform:scale({{ scale }});transition:opacity .45s ease,transform .45s ease">
    <div style="position:absolute;left:0;top:0;right:0;height:250px;border-bottom:1px solid #8A8F96;overflow:hidden">
      <img src="f484d430-5788-4d2e-b55f-612a46703b27" width="718" height="250" alt="" style="display:block">
    </div>
    <div style="position:absolute;left:40px;top:278px;display:flex;align-items:center;gap:16px">
      <img src="94e639f1-a000-4bea-9d41-6dd5de0fac75" width="64" height="64" alt="">
      <div style="display:flex;flex-direction:column;gap:5px">
        <div style="font-size:30px;font-weight:600;letter-spacing:-0.4px;color:#FFFFFF;line-height:1;white-space:nowrap">JasperOps</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#C7D6F2;white-space:nowrap">1.0.0 · Build a3f9c21</div>
      </div>
    </div>
    <div style="position:absolute;left:40px;right:40px;bottom:30px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px">
      <div style="font-size:12px;color:#C7D6F2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ status }}</div>
      <div style="font-size:11px;color:#9FB3DA;white-space:nowrap">CopyRight Notice Here</div>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:6px;background:#0B1A3C;border-top:1px solid #2A4580">
      <div style="height:100%;width:{{ pct }};background:linear-gradient(180deg,#5A8BE0,#2F65CA 60%,#1F4C9E);transition:{{ barTransition }}"></div>
    </div>
  </div>
  <sc-if value="{{ showControls }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#E6E8EB">
      <button sc-camel-on-click="{{ replay }}" style="height:26px;padding:0 14px;font:inherit;color:#1E1F22;background:linear-gradient(#FDFEFF,#DCE2EA);border:1px solid #6B7079;border-radius:3px;cursor:pointer">Replay</button>
      <button sc-camel-on-click="{{ togglePause }}" style="height:26px;min-width:72px;padding:0 14px;font:inherit;color:#1E1F22;background:linear-gradient(#FDFEFF,#DCE2EA);border:1px solid #6B7079;border-radius:3px;cursor:pointer">{{ pauseLabel }}</button>
      <button sc-camel-on-click="{{ prev }}" style="height:26px;width:30px;font:inherit;color:#1E1F22;background:linear-gradient(#FDFEFF,#DCE2EA);border:1px solid #6B7079;border-radius:3px;cursor:pointer">‹</button>
      <button sc-camel-on-click="{{ next }}" style="height:26px;width:30px;font:inherit;color:#1E1F22;background:linear-gradient(#FDFEFF,#DCE2EA);border:1px solid #6B7079;border-radius:3px;cursor:pointer">›</button>
      <span style="font-family:'IBM Plex Mono',monospace;white-space:nowrap;margin-left:6px">{{ phaseLabel }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.25,&quot;max&quot;:3,&quot;step&quot;:0.25,&quot;tsType&quot;:&quot;number&quot;},&quot;loop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  steps = [
    ['Starting Java runtime…', 6],
    ['Reading configuration…', 14],
    ['Unlocking credential vault…', 24],
    ['Loading plugin: File Server', 36],
    ['Loading plugin: Tunnels', 46],
    ['Loading plugin: Credential Vault', 56],
    ['Loading plugin: Run Dialog', 64],
    ['Indexing hosts…', 76],
    ['Restoring workspace…', 88],
    ['Starting JasperOps Workstation…', 100],
  ];
  state = { i: -1, visible: false, paused: false, capture: false };
  componentDidMount() {
    window.__capture = n => { clearTimeout(this.t); this.setState({ capture: true, paused: true, visible: true, i: n }); };
    this.replay();
  }
  componentWillUnmount() { clearTimeout(this.t); }
  wait(ms, fn) { clearTimeout(this.t); this.t = setTimeout(fn, ms / (this.props.speed ?? 1)); }
  replay = () => {
    this.setState({ i: -1, visible: false, paused: false });
    this.wait(500, () => { this.setState({ visible: true }); this.wait(450, () => this.advance()); });
  };
  advance() {
    if (this.state.paused) return;
    const i = this.state.i + 1;
    if (i >= this.steps.length) {
      this.wait(900, () => { this.setState({ visible: false }); if (this.props.loop ?? true) this.wait(1400, this.replay); });
      return;
    }
    this.setState({ i });
    this.wait(i === this.steps.length - 1 ? 300 : 380 + ((i * 137) % 5) * 110, () => this.advance());
  }
  togglePause = () => {
    const paused = !this.state.paused;
    this.setState({ paused }, () => { if (!paused) this.advance(); else clearTimeout(this.t); });
  };
  step = d => { clearTimeout(this.t); this.setState(s => ({ paused: true, visible: true, i: Math.max(0, Math.min(this.steps.length - 1, s.i + d)) })); };
  renderVals() {
    const { i, visible, paused, capture } = this.state;
    const [status, p] = i < 0 ? ['', 0] : this.steps[i];
    return {
      status, pct: p + '%',
      opacity: visible ? 1 : 0, scale: visible ? 1 : 0.985,
      barTransition: i < 0 ? 'none' : 'width .35s ease-out',
      align: capture ? 'flex-start' : 'center', justify: capture ? 'flex-start' : 'center',
      pad: capture ? '0' : '40px', shadow: capture ? 'none' : '0 24px 64px rgba(10,14,24,.45),0 2px 8px rgba(10,14,24,.25)',
      showControls: !capture,
      pauseLabel: paused ? 'Play' : 'Pause',
      phaseLabel: i < 0 ? 'Opening…' : `Phase ${i + 1} of ${this.steps.length}`,
      replay: this.replay, togglePause: this.togglePause,
      prev: () => this.step(-1), next: () => this.step(1),
    };
  }
}
</script>
