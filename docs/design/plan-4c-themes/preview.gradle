// Run from the repository root: ./gradlew :jasper-app:mockUiPreview --init-script docs/design/plan-4c-themes/preview.gradle
allprojects {
    afterEvaluate {
        if (name == 'jasper-app') {
            tasks.named('mockUiPreview') {
                mainClass = 'dev.jasper.app.SystemThemePreview'
                setArgs([rootProject.file('docs/design/plan-4c-themes').absolutePath])
            }
        }
    }
}
