# Jasper example configuration
# Copy this file to your platform's config.toml, then edit only the values you want to change.
# All active values below are Jasper's built-in defaults.

[window]
# Live across open windows. Range: 28-72 logical pixels.
tab_height = 38
# Live across open windows. Options: "icons_and_labels", "icons", or "hidden".
toolbar = "icons_and_labels"
# Live across open windows.
status_bar = true
# Initial grid for new windows only. Columns: 5-500; lines: 2-200.
columns = 150
lines = 45

[buddy]
# Live. Show the pixel-art Jasper floating above your windows while a terminal is open.
# View > Show Jasper (also in the command palette) and right-click > Hide Jasper toggle him for the session.
enabled = true

[notifications]
# Live. Notify when a command that ran at least this long finishes in a pane you are not looking at.
# Needs shell integration: the duration comes from its command marks. Zero disables. Range 0-3600.
long_command_seconds = 10

[background]
# Restart required for residency; the login item updates on reload. Keep Jasper running with no
# windows after the last one closes so the next launch can reuse the warm process, and start it in the background
# at login. Quit (Cmd+Q) still exits completely. Autostart requires an installed Jasper: a
# ./gradlew run development session stays resident but never registers a login item.
enabled = false

[palette]
# Live. Rows the command palette shows in every scope (Commands and History). Range: 1-20.
# Cmd/Ctrl+1-5 still act on the first five rows.
max_results = 5

[palette.scopes.history]
# Live. Search shell history from the palette with Cmd+R (macOS) or Ctrl+Shift+R.
# Jasper reads zsh, bash, fish, nushell and PowerShell history files without rewriting them.
# Live shell history stays in memory; command-palette usage is stored separately.
enabled = true
# Live. On an empty History query, these commands rank below more substantial ones. Each entry is a single
# word matched against a command's first word, so "cd .." is trivial but "cd path && build" is not.
# Nonempty queries rank match quality, directory and recency instead. An empty list turns this off;
# setting the key replaces the default list entirely rather than adding to it.
trivial_commands = ["exit", "clear", "ls", "ll", "la", "cd", "pwd", "c", "q", "logout"]

[font]
# Live across existing and new panes. Missing fonts use JBR/system fallback.
family = "JetBrains Mono"
# Range: 6-72 points. A saved size change is live; new panes and Font reset use this value.
size = 16.0
# Ordered live fallbacks; names must be nonblank. An empty list is allowed.
fallback = ["Symbols Nerd Font Mono", "Apple Color Emoji"]
# Live across existing and new panes.
ligatures = true
# Live multiplier from 1.0-3.0. It changes cell height without changing cell width.
line_height = 1.0

[terminal]
# New panes only. Range: 0-1000000 retained lines; zero disables scrollback history.
scrollback = 10000
# Live. Options: "left", "right", "both", or "none".
option_as_meta = "left"
# Live. Range: 0.0-1.0; zero disables inactive dimming and one fully dims.
dim_inactive_panes = 0.3
# Live. Completed local selections copy when true.
copy_on_select = false
# Live. Options: "visual", "sound", or "none".
bell = "visual"
# Shell process exit: "keep_open" retains the stopped terminal and output (the default).
# Use "close_on_success" for code 0 only, or "close" for any exit.
# Only the exited pane closes; its tab/window closes when empty. Live for future exits;
# reloading never closes previously retained output. A program returning to the shell is not a shell exit.
on_exit = "keep_open"
# New panes only. "auto" loads Jasper's shell integration script (zsh, bash, fish) after your startup files;
# "manual" only exports JASPER_SHELL_INTEGRATION for you to source; "off" does neither.
shell_integration = "auto"

[terminal.shell]
# New panes only. An empty program selects the platform default login shell.
# Configured args append to that default command. An explicit program receives only these args,
# with no implicit login flag. Each array item is passed as one exact argument: Jasper performs
# no shell parsing, splitting, expansion, or interpolation. Program and args must contain no NUL.
program = ""
args = []

[terminal.cursor]
# Live fallback until a running program sets its own cursor. Shape: "block", "beam", or "underline".
shape = "block"
blink = true

[terminal.env]
# New panes only. Uncomment entries to overlay the inherited environment with exact string values.
# Names must match [A-Za-z_][A-Za-z0-9_]* and values must contain no NUL. TERM and COLORTERM are
# reserved: Jasper always sets TERM=xterm-256color and COLORTERM=truecolor. This table does not
# choose the default login shell; setting SHELL here only changes the child's environment.
# Desktop launches remove inherited TERM_PROGRAM, TERM_PROGRAM_VERSION, TERM_SESSION_ID, TMUX,
# TMUX_PANE, and ITERM_* variables before applying this overlay; configured values override them.
# On macOS, LANG defaults to en_US.UTF-8 only when absent or blank; LC_* values are preserved.
# MY_VARIABLE = "a value with spaces"

[ui.theme]
# Live across open windows. Options: "dark" or "light"; each pairs FlatLaf chrome with its terminal palette.
variant = "dark"

[keybindings]
# Optional live overrides. Shortcuts must be unique; use "none" to disable an action.
# On macOS, cmd is Command and alt/option is Option. Example:
# new_tab = "cmd+t"
# split_down = "cmd+shift+d"
# On Linux and Windows, cmd means Ctrl+Shift; literal Ctrl combinations are often clearer. Example:
# new_tab = "ctrl+shift+t"
# split_down = "ctrl+alt+shift+d"
# macOS: keep Cmd+K for Clear Scrollback and open the palette with Cmd+P.
# command_palette = "cmd+p"
# clear_scrollback = "cmd+k"
# Windows/Linux: free Ctrl+K for the terminal and open the palette with Ctrl+P.
# command_palette = "ctrl+p"
