        assert dependencies('uninstallWindowsUser') == ['compileWindowsUserInstaller']
        assert tasks.named('installWindowsUser').get().mainClass.get() == 'UserInstall'
        assert tasks.named('uninstallWindowsUser').get().mainClass.get() == 'UserInstall'
        logger.lifecycle('Verified Windows user installation task wiring')
    }
}

