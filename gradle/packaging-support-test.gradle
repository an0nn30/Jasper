// runAotTraining against stand-ins for the launcher: /bin/sh scripts that read JAVA_TOOL_OPTIONS the way the JVM does,
// write Plan 1's trace JSON and, on SIGTERM, the cache. Windows has no /bin/sh, and AOT training is macOS-only.
verifySupport.configure {
    doLast {
        if (System.getProperty('os.name').startsWith('Windows')) return
        File fakes = new File(temporaryDir, 'aot training')   // a space, as in a checkout under "My Projects"
        fakes.deleteDir()
        fakes.mkdirs()
        String readOptions = '''eval "set -- $JAVA_TOOL_OPTIONS"
for option in "$@"; do
  case "$option" in
    -Djasper.startupTrace=*) trace=${option#-Djasper.startupTrace=} ;;
    -XX:AOTCacheOutput=*) cache=${option#-XX:AOTCacheOutput=} ;;
  esac
done
printf '%s\\n' "$@" > "${cache%/*}/options.txt"
'''
        def settles = { String milestones, boolean writesCache ->
            (writesCache ? 'trap \'printf cache > "$cache"; exit 143\' TERM\n' : 'trap \'exit 143\' TERM\n') +
                'printf \'{"schema":1,"pid":%s,"kind":"cold","settled":true,"milestones":{' + milestones + '}}\' "$$" > "$trace.part"\n' +
                'mv "$trace.part" "$trace"\n' +
                'while :; do sleep 1; done\n'
        }
        def fake = { String name, String body ->
            File script = new File(fakes, "${name}.sh")
            script.setText('#!/bin/sh\n' + readOptions + body, 'UTF-8')
            script.setExecutable(true, false)
            script
        }
        def expectFailure = { String expected, Closure action ->
            try {
                action()
                assert false : "expected a failure mentioning: ${expected}"
            } catch (GradleException failure) {
                assert failure.message.contains(expected) : failure.message
            }
        }
        String complete = '"WINDOW_SHOWN":1.0,"OUTPUT_PAINTED":2.0,"PLUGINS_BOUND":3.0'
        File work = new File(fakes, 'work')
        File cache = runAotTraining(fake('trains', settles(complete, true)), work, 20, 20)
        assert cache == new File(work, 'jasper.aot') && cache.getText('UTF-8') == 'cache'
        assert new File(work, 'options.txt').readLines('UTF-8') == ["-XX:AOTCacheOutput=${cache.absolutePath}",
            "-Duser.home=${new File(work, 'home').absolutePath}", "-Djasper.startupTrace=${new File(work, 'startup-trace.json').absolutePath}",
            '-Dapple.awt.UIElement=true']*.toString()
        String trainingConfig = new File(work, 'home/.config/jasper/config.toml').getText('UTF-8')
        assert trainingConfig.contains('run_in_background = false') && trainingConfig.contains('program = "/bin/sh"')
        assert trainingConfig.contains('args = ["' + new File(work, 'training-shell.sh').absolutePath + '"]')
        assert new File(work, 'training-shell.sh').canExecute()
        assert new File(work, 'home/.config/jasper/workspace.toml').bytes == aotTrainingWorkspace.bytes
        assert aotTrainingWorkspace.getText('UTF-8').contains('kind = "terminal"')
        assert aotTrainingConfig(new File('/w/say "hi"/s.sh')).contains('args = ["/w/say \\"hi\\"/s.sh"]')
        expectFailure('Jasper exited (3) before start-up settled') { runAotTraining(fake('exits', 'exit 3\n'), work, 20, 20) }
        expectFailure('start-up settled without OUTPUT_PAINTED, so the cache would miss') {
            runAotTraining(fake('no-output', settles('"WINDOW_SHOWN":1.0,"PLUGINS_BOUND":3.0', true)), work, 20, 20)
        }
        expectFailure('start-up did not settle within 1 s') { runAotTraining(fake('stalls', 'while :; do sleep 1; done\n'), work, 1, 20) }
        expectFailure('the JVM wrote no cache') { runAotTraining(fake('no-cache', settles(complete, false)), work, 20, 20) }
        logger.lifecycle('Verified AOT training orchestration against stand-in launchers')

        // A launcher that ignores SIGTERM, with a child that does too (the JVM's cache-assembly child): once the bounded
        // exit wait times out, runAotTraining must kill both rather than orphan the child.
        String stubborn = 'trap \'\' TERM\n' +
            'sleep 600 &\n' +
            'printf \'%s %s\' "$$" "$!" > "${cache%/*}/pids.txt"\n' +
            'printf \'{"schema":1,"pid":%s,"kind":"cold","settled":true,"milestones":{' + complete + '}}\' "$$" > "$trace.part"\n' +
            'mv "$trace.part" "$trace"\n' +
            'while :; do sleep 1; done\n'
        expectFailure('did not exit within 1 s of SIGTERM') { runAotTraining(fake('stubborn', stubborn), work, 20, 1) }
        List<Long> stubbornPids = new File(work, 'pids.txt').getText('UTF-8').tokenize().collect { it as Long }
        assert stubbornPids.size() == 2 && stubbornPids.every { it > 1 } : stubbornPids
        stubbornPids.each { Long pid ->
            assert !ProcessHandle.of(pid).map { it.isAlive() }.orElse(false) : "process ${pid} outlived the failed training launch"
        }
        logger.lifecycle('Verified a timed-out training launch leaves no process behind')
    }
}

// detachMount: hdiutil detach, once more after a pause, then hdiutil detach -force. The runner here answers from a list
// of exit codes and the pause is counted, not slept, so the fixtures stay instant.
verifySupport.configure {
    doLast {
        File mount = new File(temporaryDir, 'My Volume/mount')   // a space, as in a checkout under "My Projects"
        List<String> plain = ['/usr/bin/hdiutil', 'detach', mount.absolutePath]
        List<String> forced = ['/usr/bin/hdiutil', 'detach', '-force', mount.absolutePath]
        def detach = { List<Integer> exitCodes ->
            List<List<String>> commands = []
            int pauses = 0
            boolean detached = detachMount(mount, { List<String> command -> commands << command; exitCodes[commands.size() - 1] }, { pauses++ })
            [detached: detached, commands: commands, pauses: pauses]
        }
        assert detach([0]) == [detached: true, commands: [plain], pauses: 0]
        assert detach([1, 0]) == [detached: true, commands: [plain, plain], pauses: 1]
        assert detach([1, 16, 0]) == [detached: true, commands: [plain, plain, forced], pauses: 1]
        assert detach([1, 1, 1]) == [detached: false, commands: [plain, plain, forced], pauses: 1]
        logger.lifecycle('Verified the DMG detach retry and force')
    }
}

verifySupport.configure {
    doLast {
        File original = new File(temporaryDir, 'times/original')
        File copied = new File(temporaryDir, 'times/copied')
        [original, copied].each { it.deleteDir(); new File(it, 'plugins').mkdirs() }
        long stamp = 1_759_400_000_000L
        ['jasper-app.jar', 'plugins/tool.jar', 'jasper.aot'].each { String name ->
            [original, copied].each { File root ->
                File file = new File(root, name)
                file.text = name
                assert file.setLastModified(stamp)
            }
        }
        assert modificationTimeMismatches(original, copied).isEmpty()
        assert new File(copied, 'plugins/tool.jar').setLastModified(stamp + 1_000)
        assert new File(copied, 'jasper.aot').delete()
        assert new File(copied, 'jasper-app.jar').setLastModified(stamp + 400)   // same second: HFS+ and the JVM keep whole seconds
        assert modificationTimeMismatches(original, copied) == ['jasper.aot', "plugins${File.separator}tool.jar".toString()]
        logger.lifecycle('Verified modification-time comparison')
    }
}

verifySupport.configure {
    doLast {
        // Spec 2026-10-14 section 3.3: training runs in a copy that is gone before the cache is verified.
        File root = new File(temporaryDir, 'training copy')
        root.deleteDir()
        File image = new File(root, 'image/Jasper.app')
        File copy = new File(root, 'aot-training-image/Jasper.app')
        File jar = new File(image, 'Contents/app/jasper-app.jar')
        jar.parentFile.mkdirs()
        jar.text = 'jar'
        assert jar.setLastModified(1_759_400_000_000L)
        def keepTimes = { File from, File to ->
            from.eachFileRecurse(groovy.io.FileType.FILES) { File source ->
                File target = new File(to, from.toPath().relativize(source.toPath()).toString())
                target.parentFile.mkdirs()
                target.bytes = source.bytes
                assert target.setLastModified(source.lastModified())
            }
        }
        File stale = new File(copy, 'Contents/app/left-over.jar')
        stale.parentFile.mkdirs()
        stale.text = 'from a killed training'

        File seen = null
        def result = trainInCopy(image, copy, keepTimes, { File trainee ->
            seen = trainee
            assert new File(trainee, 'Contents/app/jasper-app.jar').text == 'jar'
            assert !new File(trainee, 'Contents/app/left-over.jar').exists() : 'a stale copy is replaced'
            'cache'
        })
        assert result == 'cache' && seen == copy
        assert !copy.exists() : 'the copy is gone once training returns'
        assert jar.isFile() : 'the image is untouched'

        boolean trained = false
        def loseTimes = { File from, File to ->
            keepTimes(from, to)
            assert new File(to, 'Contents/app/jasper-app.jar').setLastModified(1_800_000_000_000L)
        }
        try {
            trainInCopy(image, copy, loseTimes, { File trainee -> trained = true })
            assert false : 'a copy with other modification times must fail'
        } catch (GradleException expected) {
            assert expected.message.contains('jasper-app.jar') && expected.message.contains('modification times')
        }
        assert !trained && !copy.exists()

        try {
            trainInCopy(image, copy, keepTimes, { File trainee -> throw new GradleException('training failed') })
            assert false : 'a failed training must propagate'
        } catch (GradleException expected) {
            assert expected.message == 'training failed'
        }
        assert !copy.exists() : 'a failed training still removes the copy'

        // A copy that cannot be deleted is an error: verifyAotCache would see the training paths in it. A directory
        // without write permission keeps its entries; root ignores that, so the case is skipped there and on Windows.
        if (!System.getProperty('os.name').toLowerCase().contains('windows') && System.getProperty('user.name') != 'root') {
            File locked = null
            try {
                trainInCopy(image, copy, keepTimes, { File trainee ->
                    locked = new File(trainee, 'Contents/locked')
                    locked.mkdirs()
                    new File(locked, 'held.txt').text = 'held'
                    assert locked.setWritable(false, false)
                    'cache'
                })
                assert false : 'a copy that cannot be deleted must fail'
            } catch (GradleException expected) {
                assert expected.message.contains('could not delete the training copy') && expected.message.contains(copy.path)
            } finally {
                if (locked != null) locked.setWritable(true, false)
                copy.deleteDir()
            }
            assert !copy.exists() : 'the leftover of the locked copy is removed again'
        }
        logger.lifecycle('Verified training in a throwaway copy')
    }
}

// The build's runtime is the JetBrains Runtime with JCEF: the release file of one without it is refused, and so is
// one that has the module but no JCEF version, and one that names another build than jcefRuntimeBuild.
verifySupport.configure {
    doLast {
        String jcef = '''JAVA_VERSION="25.0.4.1"
IMPLEMENTOR_VERSION="JBRSDK-25.0.4.1+1-635.75-jcef"
MODULES="java.base java.desktop gluegen.rt jogl.all jcef jdk.jpackage"
JCEF_VERSION="150.0.14.1233+g9df0879"
JCEF_VERSION_DETAILED=150.0.14-g7c1aa68-chromium-150.0.7871.129-api-1.21-263-b16
'''
        String plain = '''JAVA_VERSION="25.0.4.1"
IMPLEMENTOR_VERSION="JBRSDK-25.0.4.1+1-583.48-nomod"
MODULES="java.base java.desktop jdk.jpackage"
'''
        assert jcefRuntimeProblem(jcef) == null
        assert jcefRuntimeProblem(plain) == 'it has no jcef module'
        assert jcefRuntimeProblem(jcef.replace(' jcef', '')) == 'it has no jcef module'
        assert jcefRuntimeProblem(jcef.readLines().findAll { !it.startsWith('JCEF_VERSION_DETAILED') }.join('\n')) ==
            'its release file names no JCEF version'
        assert jcefRuntimeProblem('') == 'it has no jcef module'
        assert jcefRuntimeProblem(jcef.replace(' jcef ', ' jcef.something ')) == 'it has no jcef module'
        // Another build is refused too, however close: the first pinned value that differs is named.
        assert jcefRuntimeProblem(jcef.replace('chromium-150.0.7871.129', 'chromium-150.0.7871.130')) ==
            'its JCEF_VERSION_DETAILED is 150.0.14-g7c1aa68-chromium-150.0.7871.130-api-1.21-263-b16'
        assert jcefRuntimeProblem(jcef.replace('263-b16', '263-b160')) ==
            'its JCEF_VERSION_DETAILED is 150.0.14-g7c1aa68-chromium-150.0.7871.129-api-1.21-263-b160'
        assert jcefRuntimeProblem(jcef.replace('1233+g9df0879', '1240+g0123abc')) == 'its JCEF_VERSION is 150.0.14.1240+g0123abc'
        assert jcefRuntimeProblem(jcef.replace('635.75', '640.1')) == 'its IMPLEMENTOR_VERSION is JBRSDK-25.0.4.1+1-640.1-jcef'
        assert jcefRuntimeProblem(jcef.replace('635.75', '640.1').replace('chromium-150.0.7871.129', 'chromium-151.0.7900.1')) ==
            'its IMPLEMENTOR_VERSION is JBRSDK-25.0.4.1+1-640.1-jcef'
        assert jcefRuntimeProblem(jcef.readLines().findAll { !it.startsWith('JCEF_VERSION=') }.join('\n')) ==
            'its release file has no JCEF_VERSION'
        // Quoting and CRLF line ends make no difference.
        assert jcefRuntimeProblem(jcef.replace('DETAILED=150', 'DETAILED="150').replace('b16\n', 'b16"\n')) == null
        assert jcefRuntimeProblem(jcef.replace('\n', '\r\n')) == null
        File sdk = new File('/jbr') // the message prints the File, which is \jbr on Windows
        requireJcefRuntime(sdk, jcef)
        try {
            requireJcefRuntime(sdk, plain)
            assert false : 'a runtime without JCEF must be refused'
        } catch (GradleException expected) {
            assert expected.message == "The selected JBR SDK at ${sdk} is not the JCEF build JBRSDK-25.0.4.1+1-635.75-jcef: " +
                'it has no jcef module. Install that build, or make Gradle use it (docs/packaging.md#requirements).'
        }
        try {
            requireJcefRuntime(sdk, jcef.replace('635.75', '640.1'))
            assert false : 'another JCEF build must be refused'
        } catch (GradleException expected) {
            assert expected.message == "The selected JBR SDK at ${sdk} is not the JCEF build JBRSDK-25.0.4.1+1-635.75-jcef: " +
                'its IMPLEMENTOR_VERSION is JBRSDK-25.0.4.1+1-640.1-jcef. Install that build, or make Gradle use it ' +
                '(docs/packaging.md#requirements).'
        }
        // The Licenses window names the Chromium, Chromium Embedded Framework and JCEF of the pinned build.
        String notices = rootProject.file('jasper-app/src/main/resources/dev/jasper/app/about/licenses/notices.toml').getText('UTF-8')
        Map<String, String> noticed = notices.split(/(?m)^\[\[component\]\]/).collectEntries { String component ->
            def name = component =~ /(?m)^name = "([^"]*)"/
            def version = component =~ /(?m)^version = "([^"]*)"/
            name.find() && version.find() ? [(name.group(1)): version.group(1)] : [:]
        }
        def detailed = jcefRuntimeBuild.JCEF_VERSION_DETAILED =~ /^([0-9.]+)-g[0-9a-f]+-chromium-([0-9.]+)-/
        assert detailed.find() : "JCEF_VERSION_DETAILED names no CEF and Chromium version: ${jcefRuntimeBuild.JCEF_VERSION_DETAILED}"
        Map<String, String> pinned = ['Chromium': detailed.group(2), 'Chromium Embedded Framework': detailed.group(1),
            'JCEF': jcefRuntimeBuild.JCEF_VERSION]
        assert noticed.subMap(pinned.keySet()) == pinned :
            "notices.toml names ${noticed.subMap(pinned.keySet())}, jcefRuntimeBuild in gradle/packaging-support.gradle ${pinned}"
        logger.lifecycle('Verified the JCEF runtime check')
    }
}

// Windows and Linux get Chromium from the runtime's own jcef.jmod: packaging/jcef lists its files as paths inside the
// runtime, and verifyPackage requires every one. jlink drops the execute bit of the Linux helpers.
verifySupport.configure {
    doLast {
        boolean windowsHost = System.getProperty('os.name').toLowerCase().contains('windows')
        Map<String, Integer> sizes = ['windows-x64': 240, 'windows-aarch64': 238, 'linux-x64': 236, 'linux-aarch64': 236]
        sizes.each { String platform, Integer size ->
            def (os, arch) = platform.tokenize('-')
            List<String> files = jcefPayload(os, arch)
            assert files.size() == size : "${platform} lists ${files.size()} files"
            assert files == files.toUnique() && files == files.toSorted()
            assert files.every { !it.startsWith('/') && !it.contains('\\') && !it.tokenize('/').any { part -> part in ['.', '..'] } }
            String dir = os == 'windows' ? 'bin' : 'lib'
            assert files.any { it.endsWith(os == 'windows' ? 'libcef.dll' : 'libcef.so') }
            assert files.any { it.endsWith(os == 'windows' ? 'jcef_helper.exe' : 'jcef_helper') }
            ['libcef', 'jcef_helper', 'icudtl.dat', 'resources.pak', 'v8_context_snapshot.bin', 'chrome_100_percent.pak',
                'chrome_200_percent.pak', 'locales/en-US.pak'].each { String name ->
                assert files.any { it.startsWith("${dir}/${name}") } : "${platform} lacks ${name}"
            }
            List<String> locales = files.findAll { it.startsWith("${dir}/locales/") }
            assert locales.size() > 50 && locales.every { it.endsWith('.pak') }
            assert files.every { !it.startsWith('#') && !it.isBlank() }
        }
        assert jcefPayload('linux', 'x64').containsAll(jcefLinuxHelpers) && jcefPayload('linux', 'aarch64').containsAll(jcefLinuxHelpers)
        assert !jcefPayload('windows', 'x64').any { it.endsWith('/libcef.so') }
        try {
            jcefPayload('macos', 'aarch64')
            assert false : 'macOS has no list: its Chromium is a framework'
        } catch (GradleException expected) {
            assert expected.message.contains('macos-aarch64.txt')
        }

        // The package check on a runtime folder built from a list: complete, then missing files named in one message.
        File linuxHome = new File(temporaryDir, 'jcef-runtime-linux')
        delete(linuxHome)
        jcefPayload('linux', 'x64').each { new File(linuxHome, it).with { parentFile.mkdirs(); text = 'x' } }
        if (!windowsHost) {
            // jlink's files come without it; markJcefHelpersExecutable gives the helpers owner, group and other execute and
            // leaves the other files alone.
            String locked = jcefPayloadProblem(linuxHome, 'linux', 'x64')
            assert locked != null && locked.contains('lib/jcef_helper') && locked.contains('lib/cef_server') && locked.contains('not executable')
            markJcefHelpersExecutable(linuxHome)
            jcefLinuxHelpers.each { String helper ->
                File file = new File(linuxHome, helper)
                assert file.canExecute()
                assert java.nio.file.Files.getPosixFilePermissions(file.toPath())*.name().containsAll(
                    ['OWNER_EXECUTE', 'GROUP_EXECUTE', 'OTHERS_EXECUTE'])
            }
            assert !new File(linuxHome, 'lib/libcef.so').canExecute()
        }
        markJcefHelpersExecutable(linuxHome) // a no-op where the file system has no POSIX permissions (Windows)
        assert jcefPayloadProblem(linuxHome, 'linux', 'x64') == null
        assert new File(linuxHome, 'lib/libcef.so').delete() && new File(linuxHome, 'lib/locales/af.pak').delete()
        String missing = jcefPayloadProblem(linuxHome, 'linux', 'x64')
        assert missing.contains('lib/libcef.so') && missing.contains('lib/locales/af.pak') && missing.contains('2 of 236')
        assert missing.contains(linuxHome.toString())
        linuxHome.toPath().resolve('lib/locales').toFile().listFiles().each { it.delete() }
        String many = jcefPayloadProblem(linuxHome, 'linux', 'x64')
        assert many.contains('lib/libcef.so') && many.contains('and 201 more') && many.contains('221 of 236')
        // Windows has no helper bit to check; a file of another architecture's list is missing from this one.
        File windowsHome = new File(temporaryDir, 'jcef-runtime-windows')
        delete(windowsHome)
        jcefPayload('windows', 'aarch64').each { new File(windowsHome, it).with { parentFile.mkdirs(); text = 'x' } }
        assert jcefPayloadProblem(windowsHome, 'windows', 'aarch64') == null
        assert new File(windowsHome, 'bin/jcef_helper.exe').delete()
        assert jcefPayloadProblem(windowsHome, 'windows', 'aarch64').contains('bin/jcef_helper.exe')
        assert jcefPayloadProblem(windowsHome, 'windows', 'x64').contains('bin/dxil.dll') // another architecture's list
        delete(linuxHome, windowsHome)
        logger.lifecycle('Verified the JCEF payload lists and their package check')
    }
}

// The workflows build on the JetBrains Runtime with JCEF: CI's check job refuses any other runtime (verifyJcefToolchain),
// the packaging tasks of the release and Linux package workflows refuse it too (nativeContext), and the SDK release and
// desktop-gtk-modern jobs, which run neither check, take the same runtime. Every setup-java step that installs the
// JetBrains distribution therefore asks for java-package: jdk+jcef. The workflow files are read as text, one step at a
// time: a step is a list item with the lines indented deeper than its dash, and it is a setup-java step when its own
// lines say uses: actions/setup-java@.
verifySupport.configure {
    doLast {
        // The JetBrains setup-java steps of one workflow file as [line: the step's first line (1-based), jcef: whether the
        // same step asks for jdk+jcef]. Quoting, a trailing comment and CRLF line ends make no difference.
        def jetbrainsSteps = { String text ->
            List<String> lines = text.readLines().collect { String line ->
                line.trim().startsWith('#') ? '' : line.replaceFirst(/\s+#.*$/, '')
            }
            List<Map> steps = []
            lines.eachWithIndex { String first, int index ->
                def dash = first =~ /^(\s*)-\s+\S/
                if (!dash.find()) return
                int indent = dash.group(1).length()
                List<String> step = [first]
                for (int next = index + 1; next < lines.size(); next++) {
                    String following = lines[next]
                    if (!following.isBlank() && following.length() - following.stripLeading().length() <= indent) break
                    step << following
                }
                if (!step.any { it =~ /\buses:\s*(['"]?)actions\/setup-java@/ }) return
                if (!step.any { it =~ /\bdistribution:\s*(['"]?)jetbrains\1\s*(?:[,}]|\z)/ }) return
                steps << [line: index + 1, jcef: step.any { it =~ /\bjava-package:\s*(['"]?)jdk\+jcef\1\s*(?:[,}]|\z)/ }]
            }
            return steps
        }

        // The reader on text of its own, so that a mistake in it cannot make the real check pass for nothing.
        def workflow = { String... withLines ->
            "jobs:\n  build:\n    steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-java@v6\n        with:\n" +
                withLines.collect { "          ${it}\n" }.join('') +
                "      - uses: gradle/actions/setup-gradle@v6\n        with:\n          java-package: jdk+jcef\n"
        }
        assert jetbrainsSteps(workflow('distribution: jetbrains', "java-version: '25'", 'java-package: jdk+jcef')) == [[line: 5, jcef: true]]
        assert jetbrainsSteps(workflow('distribution: jetbrains', "java-package: 'jdk+jcef'"))*.jcef == [true]
        assert jetbrainsSteps(workflow('distribution: "jetbrains"', 'java-package: "jdk+jcef"  # the JCEF build'))*.jcef == [true]
        assert jetbrainsSteps(workflow('distribution: jetbrains', 'java-package: jdk+jcef').replace('\n', '\r\n'))*.jcef == [true]
        assert jetbrainsSteps(workflow('distribution: jetbrains'))*.jcef == [false]
        assert jetbrainsSteps(workflow('distribution: jetbrains', 'java-package: jdk'))*.jcef == [false]
        assert jetbrainsSteps(workflow('distribution: jetbrains', 'java-package: jre+jcef'))*.jcef == [false]
        assert jetbrainsSteps(workflow('distribution: jetbrains', 'java-package: jdk+jcefx'))*.jcef == [false]
        assert jetbrainsSteps(workflow('distribution: jetbrains', '# java-package: jdk+jcef'))*.jcef == [false]
        // The following step's java-package is not this step's.
        assert jetbrainsSteps(workflow('distribution: jetbrains', "java-version: '25'"))*.jcef == [false]
        assert jetbrainsSteps(workflow('distribution: temurin')) == []
        assert jetbrainsSteps(workflow('distribution: jetbrainsx')) == []
        assert jetbrainsSteps('jobs:\n  build:\n    steps:\n      - name: JBR\n        uses: actions/setup-java@v6\n' +
            '        with: { distribution: jetbrains, java-package: jdk+jcef }\n      - run: true\n') == [[line: 4, jcef: true]]
        assert jetbrainsSteps('jobs:\n  build:\n    steps:\n    - uses: actions/setup-java@v6\n      with:\n        distribution: jetbrains\n') ==
            [[line: 4, jcef: false]]
        assert jetbrainsSteps('jobs:\n  build:\n    steps:\n      - run: echo uses actions/setup-java\n') == []
        assert jetbrainsSteps('') == []

        List<String> missing = []
        int found = 0
        rootProject.file('.github/workflows').listFiles().findAll { it.name ==~ /.+\.ya?ml/ }.sort { it.name }.each { File file ->
            jetbrainsSteps(file.getText('UTF-8')).each { Map step ->
                found++
                if (!step.jcef) missing << ".github/workflows/${file.name}:${step.line}".toString()
            }
        }
        assert found > 0 : 'no workflow under .github/workflows has a setup-java step with distribution: jetbrains'
        assert missing.isEmpty() : "These setup-java steps install the JetBrains Runtime without java-package: jdk+jcef: ${missing.join(', ')}".toString()
        logger.lifecycle("Verified java-package: jdk+jcef on all ${found} JetBrains setup-java steps of the workflows")
    }
}
