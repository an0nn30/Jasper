import groovy.json.JsonException
import groovy.json.JsonSlurper
import java.nio.file.FileSystems
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.attribute.PosixFilePermission
import java.util.concurrent.TimeUnit

// What packaging decides, as pure helpers: the runtime's modules, the native libraries copied into the app, the launcher
// configuration, the AOT training launch in a throwaway copy and the DMG detach.
// gradle/packaging.gradle applies this file; gradle/packaging-support-test.gradle checks it with fixtures
// (verifyPackagingSupport, part of check). The imports serve helpers further down: Groovy accepts imports only before
// the first statement.

// Fedora's JasPer image library owns the generic jasper package identity. jpackage appends the package name
// beneath --install-dir, so pass its parent and verify the resulting root separately.
ext.linuxPackageName = 'jasper-workstation'
ext.linuxInstallRoot = "/opt/${linuxPackageName}".toString()
ext.linuxPackageOptions = {
    ['--linux-package-name', linuxPackageName, '--install-dir', '/opt']
}

// cpio can exit at the archive trailer while rpm2cpio still writes padding, causing SIGPIPE in a pipeline.
// Finish conversion into the existing package work directory, then require extraction to succeed independently.
ext.unpackRpmPackage = { File rpm, File unpacked, File work, Closure run ->
    File payload = new File(work, 'payload.cpio')
    run(['bash', '-c', 'rpm2cpio "$1" > "$2"', 'bash', rpm.absolutePath, payload.absolutePath],
        'rpm2cpio (install rpm2cpio)')
    run(['bash', '-c', 'cd "$1" && cpio --extract --make-directories --preserve-modification-time --quiet < "$2"',
        'bash', unpacked.absolutePath, payload.absolutePath], 'cpio extraction (install cpio)')
}

// os-release is data, never a shell script; only exact distro IDs select the RPM-only aggregate.
// Other hosts retain both formats, including Debian/Ubuntu's RPM cross-packaging support.
ext.linuxPackageTasks = { String osRelease ->
    Map<String, String> identity = [:]
    (osRelease ?: '').readLines().each { String line ->
        def entry = line.trim() =~ /^(ID|ID_LIKE)=(.*)$/
        if (entry.matches()) {
            String value = entry.group(2).trim()
            if (value.size() >= 2 && ((value.startsWith('"') && value.endsWith('"')) ||
                    (value.startsWith("'") && value.endsWith("'")))) {
                value = value.substring(1, value.length() - 1)
            }
            identity[entry.group(1)] = value.toLowerCase(Locale.ROOT)
        }
    }
    List<String> ids = [identity.ID] + (identity.ID_LIKE ?: '').tokenize()
    Set<String> rpmIds = ['fedora', 'rhel', 'centos', 'rocky', 'almalinux', 'ol', 'amzn',
        'suse', 'opensuse', 'opensuse-leap', 'opensuse-tumbleweed', 'sles', 'sled'] as Set
    ids.any { it in rpmIds } ? ['packageRpm'] : ['packageDeb', 'packageRpm']
}

// The Java runtime packaged Jasper ships; docs/plugin-authoring.md ("The Java runtime") lists it for plugin authors.
// jpackage's default for a class-path application is every module, and --bind-services then also bound javac,
// jshell, jlink and jpackage. These roots keep all of Java SE for plugins, the providers a desktop application needs
// (charsets, locale data, ZIP file system, PKCS#11, smart cards, Kerberos, JAAS, DNS and RMI naming, socket options,
// the JDK HTTP server that File Server uses, sun.misc.Unsafe and Swing interop), the field diagnostics (JFR, JMX,
// attach) and jcef, the JetBrains Runtime's Chromium (JCEF) for the browser plugin: a root, because nothing else
// requires it. Windows adds its certificate stores. jdk.crypto.ec is left out: it has been empty since JDK 22. jlink
// adds what the roots require.
ext.runtimeRootModules = { String os ->
    List<String> roots = ['java.se', 'java.smartcardio', 'jcef', 'jdk.accessibility', 'jdk.attach', 'jdk.charsets',
        'jdk.crypto.cryptoki', 'jdk.httpserver', 'jdk.jfr', 'jdk.localedata', 'jdk.management', 'jdk.management.agent',
        'jdk.management.jfr', 'jdk.naming.dns', 'jdk.naming.rmi', 'jdk.net', 'jdk.security.auth', 'jdk.security.jgss',
        'jdk.unsupported', 'jdk.unsupported.desktop', 'jdk.zipfs']
    os == 'windows' ? roots + ['jdk.crypto.mscapi'] : roots
}

// Every module of the packaged runtime, sorted: the roots and what they require (java.se's Java SE modules,
// jdk.attach's jvmstat support and jcef's JOGL, jogl.all and gluegen.rt). verifyPackage compares this with the
// MODULES line of the runtime's release file.
ext.runtimeModules = { String os ->
    (runtimeRootModules(os) + ['gluegen.rt', 'java.base', 'java.compiler', 'java.datatransfer', 'java.desktop',
        'java.instrument', 'java.logging', 'java.management', 'java.management.rmi', 'java.naming', 'java.net.http',
        'java.prefs', 'java.rmi', 'java.scripting', 'java.security.jgss', 'java.security.sasl', 'java.sql',
        'java.sql.rowset', 'java.transaction.xa', 'java.xml', 'java.xml.crypto', 'jdk.internal.jvmstat',
        'jogl.all']).toSorted()
}

// The one build of the JetBrains Runtime that Jasper is made with, JBR 25.0.4.1 b635.75 with JCEF, as the release file
// of its SDK names it on all six platforms: the JBR build, and the JCEF and Chromium it carries. packaging/jcef's file
// lists and checksums, macJcefPayload and notices.toml's Chromium, Chromium Embedded Framework and JCEF entries describe
// this build, so a newer JBR starts here (docs/app-maintenance.md, "Moving to a newer JBR").
ext.jcefRuntimeBuild = [
    IMPLEMENTOR_VERSION: 'JBRSDK-25.0.4.1+1-635.75-jcef',
    JCEF_VERSION: '150.0.14.1233+g9df0879',
    JCEF_VERSION_DETAILED: '150.0.14-g7c1aa68-chromium-150.0.7871.129-api-1.21-263-b16',
].asImmutable()

// The build's runtime is the JetBrains Runtime with JCEF (Chromium) for the browser plugin. The plain build of the same
// version has the same vendor and number, so its release file decides: the MODULES line must list jcef as a whole
// token (jcef.something is another module), the file must record the JCEF version, and it must have jcefRuntimeBuild's
// values, quoted or not. Null for that build, else the first problem in words.
ext.jcefRuntimeProblem = { String releaseText ->
    String text = releaseText ?: ''
    def modules = text =~ /(?m)^MODULES="([^"]*)"/
    if (!modules.find() || !('jcef' in modules.group(1).tokenize())) return 'it has no jcef module'
    if (!(text =~ /(?m)^JCEF_VERSION_DETAILED=[ \t]*"?[^"\s]/).find()) return 'its release file names no JCEF version'
    jcefRuntimeBuild.findResult { String key, String expected ->
        def line = text =~ /(?m)^${key}=[ \t]*"?([^"\r\n]*)/
        if (!line.find()) return "its release file has no ${key}".toString()
        String found = line.group(1).trim()
        found == expected ? null : "its ${key} is ${found}".toString()
    }
}

// Refuses a runtime that is not jcefRuntimeBuild, in the words nativeContext and verifyJcefToolchain both throw.
ext.requireJcefRuntime = { File sdkHome, String releaseText ->
    String problem = jcefRuntimeProblem(releaseText)
    if (problem != null) {
        throw new GradleException("The selected JBR SDK at ${sdkHome} is not the JCEF build ${jcefRuntimeBuild.IMPLEMENTOR_VERSION}: ${problem}. Install that build, or make Gradle use it (docs/packaging.md#requirements).")
    }
}

// On macOS Chromium is not part of the module image: the SDK keeps its framework and helper apps in
// Contents/Frameworks beside Contents/Home, and JCEF looks for them at java.home/../Frameworks. packageApp copies that
// folder to Jasper.app/Contents/runtime/Contents/; verifyPackage requires these paths in the copy.
ext.macJcefFrameworks = 'Frameworks'
ext.macJcefPayload = ['Chromium Embedded Framework.framework', 'jcef Helper.app', 'jcef Helper (GPU).app',
    'jcef Helper (Renderer).app', 'jcef Helper (Plugin).app'].collect { "cef_server.app/Contents/Frameworks/${it}".toString() }

// The SDK's Chromium folder on macOS, or the failure nativeContext and packageApp both throw when it is missing. The
// home's real path decides: SDKMAN's candidates/java/<version> can be a link to the bundle's Contents/Home.
ext.requireMacJcefFrameworks = { File sdkHome ->
    File frameworks = new File(sdkHome.canonicalFile.parentFile, macJcefFrameworks)
    if (!frameworks.isDirectory()) {
        throw new GradleException("The JBR SDK has no Chromium framework at ${frameworks}; install the full jbrsdk_jcef bundle (SDKMAN's macOS install keeps only Contents/Home)")
    }
    frameworks
}

// On Windows and Linux Chromium's files come inside jcef.jmod, so jlink puts them in the runtime: packaging/jcef/
// <os>-<architecture>.txt (windows or linux; x64 or aarch64) lists them as paths under the runtime home, one per line,
// '#' lines being comments. verifyPackage requires each (jcefPayloadProblem). macOS has no list: its Chromium is a
// framework (macJcefPayload).
ext.jcefPayload = { String os, String architecture ->
    File list = rootProject.file("packaging/jcef/${os}-${architecture}.txt")
    if (!list.isFile()) throw new GradleException("There is no JCEF file list ${list} for ${os} on ${architecture}")
    list.readLines('UTF-8').collect { it.trim() }.findAll { !it.isEmpty() && !it.startsWith('#') }
}

// Chromium starts these two as child processes. jlink sets the execute bit on a jmod's bin/ commands only, so these
// files of the jmod's lib/ section lose it and packageApp restores it on Linux. Windows needs no bit.
ext.jcefLinuxHelpers = ['lib/jcef_helper', 'lib/cef_server']

// chmod a+x on the helpers that runtimeHome has. A helper that is missing is verifyPackage's to report. A file system
// without POSIX permissions (Windows) has no execute bit to restore, so nothing happens there.
ext.markJcefHelpersExecutable = { File runtimeHome ->
    if (!FileSystems.default.supportedFileAttributeViews().contains('posix')) return
    jcefLinuxHelpers.collect { new File(runtimeHome, it).toPath() }.findAll { Files.isRegularFile(it) }.each { path ->
        Files.setPosixFilePermissions(path, (Files.getPosixFilePermissions(path) +
            [PosixFilePermission.OWNER_EXECUTE, PosixFilePermission.GROUP_EXECUTE, PosixFilePermission.OTHERS_EXECUTE]) as Set)
    }
}

// Why runtimeHome lacks what a Windows or Linux package needs of JCEF, or null: every jcefPayload file, all named in
// one message (the first twenty, then a count), and on Linux executable helpers.
ext.jcefPayloadProblem = { File runtimeHome, String os, String architecture ->
    List<String> payload = jcefPayload(os, architecture)
    List<String> missing = payload.findAll { !new File(runtimeHome, it).isFile() }
    if (missing) {
        String named = missing.take(20).join(', ') + (missing.size() > 20 ? ", and ${missing.size() - 20} more" : '')
        return "JCEF's files are missing from ${runtimeHome}: ${missing.size()} of ${payload.size()}: ${named}".toString()
    }
    List<String> locked = os == 'linux' ?
        jcefLinuxHelpers.findAll { !Files.isExecutable(new File(runtimeHome, it).toPath()) } : []
    locked ? "JCEF's helpers are not executable in ${runtimeHome}: ${locked.join(', ')}".toString() : null
}

// No --bind-services: the roots name every provider Jasper wants. --generate-cds-archive writes the runtime's default
// CDS archive (lib/server/classes.jsa), the fallback whenever the AOT cache is unusable. No --compress: jlink's
// default leaves lib/modules uncompressed, which loads classes faster. No --strip-native-commands: bin/java stays,
// because the JVM runs it to assemble the AOT cache at the end of a training launch.
ext.jlinkOptions = '--strip-debug --no-man-pages --no-header-files --generate-cds-archive'

// Native libraries the packaged app loads from its app directory's native/ folder instead of extracting a copy with
// a new random name on every launch, which also defeats macOS's code-signature cache and the endpoint-security
// agent's. Each is copied byte for byte from its jar, so it keeps its vendor signature. Linux keeps extraction:
// FlatLaf's Linux library links GTK 3, which would become a package dependency. Keys: jar, the jar's file-name pattern;
// entry, the resource in it; path, where it goes under the app directory; executable, needs the execute bit; loaded,
// the JVM's System.load opens it, so -Xlog:library lists it (JNA opens pty4j's libraries with its own dlopen).
ext.bundledNatives = { String os, String architecture ->
    String flatLaf = 'flatlaf-[0-9][^/]*[.]jar', jna = 'jna-[0-9][^/]*[.]jar', pty4j = 'pty4j-[0-9][^/]*[.]jar'
    if (os == 'macos') {
        String flatLafArchitecture = architecture == 'aarch64' ? 'arm64' : 'x86_64'
        String jnaArchitecture = architecture == 'aarch64' ? 'aarch64' : 'x86-64'
        return [
            [jar: flatLaf, entry: "com/formdev/flatlaf/natives/libflatlaf-macos-${flatLafArchitecture}.dylib".toString(),
             path: "native/libflatlaf-macos-${flatLafArchitecture}.dylib".toString(), executable: false, loaded: true],
            [jar: jna, entry: "com/sun/jna/darwin-${jnaArchitecture}/libjnidispatch.jnilib".toString(),
             path: 'native/libjnidispatch.jnilib', executable: false, loaded: true],
            [jar: pty4j, entry: 'resources/com/pty4j/native/darwin/libpty.dylib', path: 'native/darwin/libpty.dylib',
             executable: false, loaded: false],
            [jar: pty4j, entry: 'resources/com/pty4j/native/darwin/pty4j-unix-spawn-helper',
             path: 'native/darwin/pty4j-unix-spawn-helper', executable: true, loaded: false],
        ]
    }
    if (os == 'windows') {
        // pty4j names its folder after JNA's architecture, and ships cyglaunch.exe for x64 only.
        boolean arm = architecture == 'aarch64'
        String flatLafArchitecture = arm ? 'arm64' : 'x86_64'
        String jnaArchitecture = arm ? 'aarch64' : 'x86-64'
        List<String> ptyFiles = ['conpty.dll', 'OpenConsole.exe'] + (arm ? [] : ['cyglaunch.exe']) +
            ['win-helper.dll', 'winpty-agent.exe', 'winpty.dll']
        return [
            [jar: flatLaf, entry: "com/formdev/flatlaf/natives/flatlaf-windows-${flatLafArchitecture}.dll".toString(),
             path: "native/flatlaf-windows-${flatLafArchitecture}.dll".toString(), executable: false, loaded: true],
            [jar: jna, entry: "com/sun/jna/win32-${jnaArchitecture}/jnidispatch.dll".toString(), path: 'native/jnidispatch.dll',
             executable: false, loaded: true],
        ] + ptyFiles.collect { String name ->
            [jar: pty4j, entry: "resources/com/pty4j/native/win/${jnaArchitecture}/${name}".toString(),
             path: "native/win/${jnaArchitecture}/${name}".toString(), executable: false, loaded: false]
        }
    }
    []
}

// The launcher options that point FlatLaf, JNA and pty4j at those files ($APPDIR is the launcher's app directory).
// pty4j looks in native/darwin or native/win/<x86-64|aarch64> below its folder. jna.nosys keeps JNA off java.library.path.
// No jna.noclasspath or jna.nounpack: JNA's properties are process-wide, and a plugin that bundles its own JNA must
// still be able to extract its own copy (docs/plugin-authoring.md, "The Java runtime").
ext.bundledNativeJvmOptions = { String os ->
    os in ['macos', 'windows'] ? ['-Dflatlaf.nativeLibraryPath=$APPDIR/native', '-Djna.boot.library.path=$APPDIR/native',
        '-Djna.nosys=true', '-Dpty4j.preferred.native.folder=$APPDIR/native'] : []
}

// A jpackage launcher configuration's class path and JVM options, in file order, with $APPDIR resolved to appDir.
ext.launcherClasspath = { String config, File appDir ->
    config.readLines().findAll { it.startsWith('app.classpath=') }
        .collect { it.substring('app.classpath='.length()).replace('$APPDIR', appDir.absolutePath) }
}
ext.launcherJavaOptions = { String config, File appDir ->
    config.readLines().findAll { it.startsWith('java-options=') }
        .collect { it.substring('java-options='.length()).replace('$APPDIR', appDir.absolutePath) }
}

// The files -Xlog:library reports as loaded ("Loaded library <path>, handle 0x...").
ext.loadedLibraries = { String log -> (log =~ /Loaded library (.+), handle 0x\p{XDigit}+/).collect { it[1] } }

// The launcher option that makes the JVM use the trained cache; trainAotCache adds it to Jasper.cfg.
ext.aotCacheOption = '-XX:AOTCache=$APPDIR/jasper.aot'

// config with option as a java-options line at the end of [JavaOptions] (a new section if there is none), replacing
// every earlier line for the same option name (the text up to its first '=').
ext.withJavaOption = { String config, String option ->
    String line = 'java-options=' + option
    boolean named = option.contains('=')
    String name = named ? line.substring(0, line.indexOf('=', 'java-options='.length()) + 1) : line
    List<String> lines = config.readLines().findAll { it != line && !(named && it.startsWith(name)) }
    int section = lines.indexOf('[JavaOptions]')
    if (section < 0) return (lines + ['', '[JavaOptions]', line]).join('\n') + '\n'
    int insert = section + 1
    for (int index = section + 1; index < lines.size() && !lines[index].startsWith('['); index++) {
        if (lines[index].startsWith('java-options=')) insert = index + 1
    }
    lines.add(insert, line)
    lines.join('\n') + '\n'
}

// JAVA_TOOL_OPTIONS for options that may contain spaces or quotes, quoted the way the JDK quotes them for its own AOT
// assembly child (jdk.internal.misc.CDS.ProcessLauncher): a whitespace or double-quote character inside single
// quotes, a single quote inside double quotes. The JVM's parser and a POSIX shell's eval both undo it.
ext.javaToolOptions = { List<String> options ->
    options.collect { String option ->
        StringBuilder quoted = new StringBuilder()
        for (char c : option.toCharArray()) {
            String text = String.valueOf(c)
            if (text == '"' || Character.isWhitespace(c)) quoted.append("'").append(text).append("'")
            else if (text == "'") quoted.append('"').append(text).append('"')
            else quoted.append(text)
        }
        quoted.toString()
    }.join(' ')
}

// The stand-in for the login shell while training: one prompt, then it reads and discards input (anything typed into
// the training window) until the terminal closes.
ext.aotTrainingShell = "#!/bin/sh\nprintf 'jasper-aot-training\$ '\nexec /bin/cat >/dev/null\n"

// The training launch's config.toml: the stand-in shell instead of the login shell, and no resident process.
ext.aotTrainingConfig = { File shell ->
    String path = shell.absolutePath.replace('\\', '\\\\').replace('"', '\\"')
    '# trainAotCache: a short-lived Jasper with a stand-in shell and no resident process.\n' +
        '[system]\nrun_in_background = false\n\n' +
        '[terminal.shell]\nprogram = "/bin/sh"\nargs = ["' + path + '"]\n'
}

// The training launch's workspace.toml: one main window with one terminal tab, which it restores as a normal start
// restores the saved windows, so the restore path's classes are in the cache. The start-up benchmark restores the same
// file before each run (StartupRuns.WORKSPACE_SEED), and StartupBenchTest checks it is what WorkspaceFile writes.
ext.aotTrainingWorkspace = project.file('src/main/resources/dev/jasper/app/benchmark/startup-workspace.toml')

// Why a settled start-up trace (Plan 1's JSON) is unfit to train from, or null: it must be this launch's, and a cold
// start that showed its window, painted the shell's output and bound every plugin.
ext.trainingTraceProblem = { Map trace, long pid ->
    if (((trace.pid ?: -1) as long) != pid) return "the trace belongs to process ${trace.pid}, not the training launch ${pid}".toString()
    if (trace.kind != 'cold') return "the launch was '${trace.kind}', not a cold start with a window".toString()
    Map milestones = (trace.milestones ?: [:]) as Map
    List<String> missing = ['WINDOW_SHOWN', 'OUTPUT_PAINTED', 'PLUGINS_BOUND'].findAll { !milestones.containsKey(it) }
    missing ? "start-up settled without ${missing.join(', ')}".toString() : null
}

// The training launch's environment: inherited with JASPER_HOME removed (it would point training at the user's real
// configuration and data), JDK_JAVA_OPTIONS, _JAVA_OPTIONS, CLASSPATH and JASPER_VM_OPTIONS_SKIP removed (they would
// change the JVM options and class path a real launch has), JASPER_AOT_CACHE_SKIP, JASPER_LAUNCH_DIAGNOSE and
// JASPER_WATCH_REPORT removed (the launcher and jasper-watch read them), JAVA_TOOL_OPTIONS replaced by javaToolOptions
// and JASPER_VM_OPTIONS pointing at vmOptions, an empty file, so the developer's own jasper.vmoptions never shapes the
// cache. Returns a new map.
ext.aotTrainingEnvironment = { Map<String, String> inherited, String javaToolOptions, File vmOptions ->
    Map<String, String> environment = new LinkedHashMap<String, String>(inherited)
    ['JASPER_HOME', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS', 'CLASSPATH', 'JASPER_VM_OPTIONS_SKIP', 'JASPER_AOT_CACHE_SKIP',
        'JASPER_LAUNCH_DIAGNOSE', 'JASPER_WATCH_REPORT'].each { environment.remove(it) }
    environment.put('JAVA_TOOL_OPTIONS', javaToolOptions)
    environment.put('JASPER_VM_OPTIONS', vmOptions.absolutePath)
    environment
}

// One training launch of launcher (Contents/MacOS/Jasper of the copy trainInCopy makes, so jpackage's launcher sets
// everything a real launch has) in work, isolated like startupBench: user.home is work/home with the training configuration
// and aotTrainingWorkspace, and JAVA_TOOL_OPTIONS asks for the cache, the start-up trace and no Dock icon. Once the trace
// has settled, SIGTERM; the JVM assembles the cache while it exits, running the runtime's bin/java (whose output lands in
// the same log, and whose JAVA_TOOL_OPTIONS the JVM replaces). Returns the cache; throws with the log's tail on any failure. The
// seconds are boxed: Groovy 4.0.32 compiles a closure with two primitive long parameters to bytecode the verifier rejects.
ext.runAotTraining = { File launcher, File work, Long settleSeconds, Long exitSeconds ->
    work.deleteDir()
    File home = new File(work, 'home')
    File config = new File(home, '.config/jasper/config.toml')
    config.parentFile.mkdirs()
    File shell = new File(work, 'training-shell.sh')
    shell.setText(aotTrainingShell, 'UTF-8')
    shell.setExecutable(true, false)
    config.setText(aotTrainingConfig(shell), 'UTF-8')
    Files.copy(aotTrainingWorkspace.toPath(), new File(config.parentFile, 'workspace.toml').toPath())
    File trace = new File(work, 'startup-trace.json')
    File cache = new File(work, 'jasper.aot')
    File log = new File(work, 'training.log')
    def builder = new ProcessBuilder(launcher.absolutePath).directory(work).redirectErrorStream(true)
        .redirectOutput(ProcessBuilder.Redirect.to(log))
    Map<String, String> environment = builder.environment()
    File emptyVmOptions = new File(work, 'empty.vmoptions')
    emptyVmOptions.text = ''
    Map<String, String> trainingEnvironment = aotTrainingEnvironment(environment, javaToolOptions(["-XX:AOTCacheOutput=${cache.absolutePath}",
        "-Duser.home=${home.absolutePath}", "-Djasper.startupTrace=${trace.absolutePath}", '-Dapple.awt.UIElement=true']*.toString()),
        emptyVmOptions)
    environment.clear()
    environment.putAll(trainingEnvironment)
    def tail = { log.isFile() ? log.readLines('UTF-8').takeRight(40).join('\n') : '(no output)' }
    Process process = builder.start()
    try {
        long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(settleSeconds)
        String problem
        while (true) {
            Map settled = null
            if (trace.isFile()) {
                try { settled = new JsonSlurper().parse(trace, 'UTF-8') as Map } catch (JsonException ignored) { }
            }
            if (settled?.settled == true) {
                problem = trainingTraceProblem(settled, process.pid())
                break
            }
            if (!process.isAlive()) throw new GradleException("AOT training: Jasper exited (${process.exitValue()}) before start-up settled\n${tail()}")
            if (System.nanoTime() > deadline) throw new GradleException("AOT training: start-up did not settle within ${settleSeconds} s\n${tail()}")
            Thread.sleep(200)
        }
        process.destroy()
        if (!process.waitFor(exitSeconds, TimeUnit.SECONDS)) {
            throw new GradleException("AOT training: Jasper did not exit within ${exitSeconds} s of SIGTERM\n${tail()}")
        }
        if (problem != null) throw new GradleException("AOT training: ${problem}, so the cache would miss that part of start-up\n${tail()}")
        if (!cache.isFile() || cache.length() == 0) throw new GradleException("AOT training: the JVM wrote no cache to ${cache}\n${tail()}")
        return cache
    } finally {
        // After SIGTERM the exiting JVM runs the runtime's bin/java to assemble the cache and waits for it. If this
        // method gives up (a timed-out wait, an interrupt), kill that child and anything below it first: once the
        // launcher is gone they would be orphans that keep writing the cache and temporary files into work.
        if (process.isAlive()) {
            List<ProcessHandle> descendants = process.descendants().toList()
            descendants.each { it.destroyForcibly() }
            process.destroyForcibly()
            (descendants*.onExit() + [process.onExit()]).each { future ->
                try { future.get(10, TimeUnit.SECONDS) } catch (Exception ignored) { }
            }
        }
    }
}

// The headless acceptance check: the image's java with the launcher's JVM options and class path, in file order, and
// -XX:AOTMode=on, which exits with an error instead of running without a stale or broken cache.
ext.aotCheckCommand = { File java, String config, File appDir ->
    ([java.absolutePath] + launcherJavaOptions(config, appDir) +
        ['-XX:AOTMode=on', '-cp', launcherClasspath(config, appDir).join(File.pathSeparator), '-version'])*.toString()
}

// Detaches the disk image mounted at mount: hdiutil detach, once more after pause (a volume something still has open is
// busy for a moment), then hdiutil detach -force. run executes a command and returns its exit code. Returns whether any
// attempt succeeded; a read-only mount that stays behind makes the next packageDist and clean fail to delete it.
ext.detachMount = { File mount, Closure run, Closure pause = { Thread.sleep(1000L) } ->
    List<String> detach = ['/usr/bin/hdiutil', 'detach', mount.absolutePath]
    if (run(detach) == 0) return true
    pause()
    if (run(detach) == 0) return true
    run(['/usr/bin/hdiutil', 'detach', '-force', mount.absolutePath]) == 0
}

// Files under expectedRoot whose copy under actualRoot is missing or has another modification time, to the second
// (HFS+ stores whole seconds, and so does the JVM's check of the class-path jars an AOT cache was trained with).
ext.modificationTimeMismatches = { File expectedRoot, File actualRoot ->
    List<String> mismatches = []
    def expected = expectedRoot.toPath(), actual = actualRoot.toPath()
    Files.walk(expected).withCloseable { paths ->
        paths.filter { Files.isRegularFile(it, LinkOption.NOFOLLOW_LINKS) }.forEach { file ->
            String relative = expected.relativize(file).toString()
            def copy = actual.resolve(relative)
            if (!Files.isRegularFile(copy, LinkOption.NOFOLLOW_LINKS) ||
                    Files.getLastModifiedTime(file, LinkOption.NOFOLLOW_LINKS).to(TimeUnit.SECONDS) !=
                    Files.getLastModifiedTime(copy, LinkOption.NOFOLLOW_LINKS).to(TimeUnit.SECONDS)) {
                mismatches << relative
            }
        }
    }
    mismatches.sort()
}

// Runs train on a copy of image at copy, made by copier (which must keep modification times, as ditto does: the JVM
// checks them for the class-path jars), and deletes the copy afterwards, also when copier or train throws. The AOT
// cache then records class-path locations that exist on no machine, so the build machine runs the trained image in
// the condition every user's machine is in (spec 2026-10-14 section 3.3). A copy left by an earlier, killed training is
// replaced. A copy that cannot be deleted fails the build, after the deletion attempt and so never in place of an
// exception from copier or train, because verifyAotCache would then see the training paths. Returns what train
// returns; train receives the copy.
ext.trainInCopy = { File image, File copy, Closure copier, Closure train ->
    copy.deleteDir()
    copy.parentFile.mkdirs()
    def trained
    try {
        copier(image, copy)
        List<String> changed = modificationTimeMismatches(image, copy)
        if (changed) {
            throw new GradleException("AOT training: the copy of ${image.name} has other modification times for " +
                "${changed.take(10)}; the JVM would refuse the cache")
        }
        trained = train(copy)
    } finally {
        copy.deleteDir()
    }
    if (copy.exists()) {
        throw new GradleException("AOT training: could not delete the training copy ${copy}; " +
            'verifyAotCache would see the training paths')
    }
    return trained
}
