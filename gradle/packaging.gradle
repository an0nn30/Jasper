def macIconName = 'Jasper'

def normalizedHost = {
    String os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    String architecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    String normalizedArchitecture = switch (architecture) {
        case ['aarch64', 'arm64'] -> 'aarch64'
        case ['amd64', 'x86_64', 'x64'] -> 'x64'
        default -> architecture
    }
    if (os.startsWith('mac')) return [os: 'macos', architecture: normalizedArchitecture]
    if (os.startsWith('windows')) return [os: 'windows', architecture: normalizedArchitecture]
    if (os.startsWith('linux')) return [os: 'linux', architecture: normalizedArchitecture]
    return [os: os, architecture: normalizedArchitecture]
}

// Keep icon inputs lazy so non-native builds remain usable on other hosts.
def nativeIcon = providers.provider {
    String extension = switch (normalizedHost().os) {
        case 'macos' -> 'icns'
        case 'windows' -> 'ico'
        default -> 'png'
    }
    rootProject.file("packaging/icons/Jasper.${extension}")
}

def validatedVersion = {
    String value = version.get()
    def match = value =~ /^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})$/
    if (!match.matches()) {
        throw new GradleException("Invalid -PjasperVersion '${value}'; expected X.Y.Z with major 1..255, minor 0..255, patch 0..65535, and no leading zeroes")
    }
    List<Integer> components = [match.group(1), match.group(2), match.group(3)].collect { Integer.parseInt(it) }
    if (components[0] < 1 || components[0] > 255 || components[1] > 255 || components[2] > 65535) {
        throw new GradleException("Invalid -PjasperVersion '${value}'; expected X.Y.Z with major 1..255, minor 0..255, patch 0..65535, and no leading zeroes")
    }
    value
}

def nativeContext = {
    String packageVersion = validatedVersion()
    def host = normalizedHost()
    if (!(host.os == 'macos' && host.architecture in ['aarch64', 'x64']) &&
            !(host.os == 'windows' && host.architecture in ['aarch64', 'x64']) &&
            !(host.os == 'linux' && host.architecture in ['aarch64', 'x64'])) {
        throw new GradleException("Native packaging supports only macOS, Windows and Linux on aarch64/x64; this host is ${System.getProperty('os.name')} ${System.getProperty('os.arch')}")
    }
    def selectedLauncher = launcher.get()
    File sdkHome = selectedLauncher.metadata.installationPath.asFile
    File sdkRelease = new File(sdkHome, 'release')
    String sdkReleaseText = sdkRelease.isFile() ? sdkRelease.getText('UTF-8') : ''
    def sdkArchitectureMatcher = sdkReleaseText =~ /(?m)^OS_ARCH="([^"]+)"/
    String toolchainArchitecture = sdkArchitectureMatcher.find() ? sdkArchitectureMatcher.group(1) : ''
    toolchainArchitecture = toolchainArchitecture.toLowerCase(Locale.ROOT)
    toolchainArchitecture = toolchainArchitecture in ['aarch64', 'arm64'] ? 'aarch64' :
            (toolchainArchitecture in ['amd64', 'x86_64', 'x64'] ? 'x64' : toolchainArchitecture)
    if (toolchainArchitecture != host.architecture) {
        throw new GradleException("The selected JBR SDK architecture (${toolchainArchitecture}) does not match the host (${host.architecture}); configure a matching JBR SDK 25")
    }
    File jpackage = new File(sdkHome, "bin/jpackage${host.os == 'windows' ? '.exe' : ''}")
    if (!jpackage.isFile()) {
        throw new GradleException("The selected JBR SDK has no jpackage at ${jpackage}; configure a matching JBR SDK 25, not a JRE")
    }
    [version: packageVersion, host: host, launcher: selectedLauncher, sdkHome: sdkHome, jpackage: jpackage]
}

def executeNative = { List<String> command, String purpose ->
    def result = providers.exec {
        commandLine(command)
        ignoreExitValue = true
    }
    String standardOutput = result.standardOutput.asText.get()
    String errorOutput = result.standardError.asText.get()
    int exitCode = result.result.get().exitValue
    if (exitCode != 0) {
        throw new GradleException("${purpose} failed with exit code ${exitCode}\n${standardOutput}${errorOutput}")
    }
    [stdout: standardOutput, stderr: errorOutput]
}

// AppKit draws the macOS 26 window controls only for a main executable whose LC_BUILD_VERSION
// records a macOS 26 or later SDK. jpackage's launcher stub records the SDK JetBrains built the
// runtime with (13.3 for JBR 25), so every Swing window would get the pre-26 controls. Rewriting
// that one load command with Apple's vtool and re-signing the bundle is enough; the stub's code is
// untouched. Needs the Xcode command line tools; without them the image keeps the legacy controls.
def installedMacSdkVersion = {
    try {
        String reported = executeNative(['/usr/bin/xcrun', '--show-sdk-version'], 'xcrun --show-sdk-version').stdout.trim()
        return reported.matches('[0-9]+([.][0-9]+)*') ? reported : null
    } catch (Exception unavailable) {
        return null
    }
}

def launcherBuildVersion = { File stub ->
    String output = executeNative(['/usr/bin/xcrun', 'vtool', '-show-build', stub.absolutePath], 'vtool -show-build').stdout
    def minos = output =~ /(?m)^\s*minos\s+(\S+)/
    def sdk = output =~ /(?m)^\s*sdk\s+(\S+)/
    [minos: minos.find() ? minos.group(1) : null, sdk: sdk.find() ? sdk.group(1) : null]
}

def refreshLauncherSdk = { File image ->
    File stub = new File(image, 'Contents/MacOS/Jasper')
    String sdk = installedMacSdkVersion()
    if (sdk == null) {
        logger.lifecycle('Launcher SDK version not updated: Xcode command line tools not found; the app keeps the pre-macOS-26 window controls')
        return
    }
    def current = launcherBuildVersion(stub)
    if (current.minos == null || current.sdk == null) throw new GradleException("Could not read the build version of ${stub}")
    if (current.sdk == sdk) return
    File patched = new File(stub.parentFile, 'Jasper.sdk-patched')
    executeNative(['/usr/bin/xcrun', 'vtool', '-set-build-version', 'macos', current.minos, sdk, '-replace',
        '-output', patched.absolutePath, stub.absolutePath], 'vtool -set-build-version')
    Files.move(patched.toPath(), stub.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    stub.setExecutable(true, false)
    logger.lifecycle("Launcher build version: SDK ${current.sdk} -> ${sdk} (minos ${current.minos})")
}

// jpackage puts every jar under --input on the application classpath, including the bundled plugins
// staged in plugins/. Those must load only through their own PluginClassLoader: MINA sshd resolves
// classes through the thread context class loader (the application loader), and an application-loader
// copy of sshd or BouncyCastle then fails to cast to the plugin's copy (ExceptionInInitializerError).
def removePluginClasspath = { File config ->
    List<String> lines = config.readLines('UTF-8')
    List<String> kept = lines.findAll { !(it.replace('\\', '/') ==~ /app\.classpath=.*\/plugins\/.*/) }
    if (kept.size() != lines.size()) config.setText(kept.join('\n') + '\n', 'UTF-8')
}

// Read the immutable launcher seed from the selected SDK, independent of the patched image.
def macLauncherTemplate = { File sdkHome ->
    new ZipFile(new File(sdkHome, 'jmods/jdk.jpackage.jmod')).withCloseable { archive ->
        def entry = archive.getEntry('classes/jdk/jpackage/internal/resources/jpackageapplauncher')
        if (entry == null) throw new GradleException('JBR SDK has no macOS jpackage launcher resource')
        archive.getInputStream(entry).withCloseable { it.readAllBytes() }
    }
}

// Re-signs after the bundle is edited: the same ad-hoc identity jpackage used; the nested runtime keeps its own signature.
def resignImage = { File image ->
    executeNative(['/usr/bin/codesign', '--force', '--sign', '-', '--preserve-metadata=entitlements,requirements,flags',
        image.absolutePath], 'codesign after bundle edits')
}

// The bytes of one bundled native library (gradle/packaging-support.gradle), read from its jar in the image's app directory.
def bundledNativeBytes = { File appDir, Map nativeFile ->
    List<File> jars = (appDir.listFiles() ?: [] as File[]).findAll { it.name ==~ nativeFile.jar }
    if (jars.size() != 1) throw new GradleException("Expected one jar matching ${nativeFile.jar} in ${appDir}, found ${jars*.name}")
    new ZipFile(jars[0]).withCloseable { zip ->
        def entry = zip.getEntry(nativeFile.entry)
        if (entry == null) throw new GradleException("${jars[0].name} has no ${nativeFile.entry}; update bundledNatives in gradle/packaging-support.gradle")
        zip.getInputStream(entry).withCloseable { it.readAllBytes() }
    }
}

// Copies the host's bundled native libraries into the image's app directory, byte for byte.
def installBundledNatives = { File appDir, Map host ->
    bundledNatives(host.os, host.architecture).each { Map nativeFile ->
        File target = new File(appDir, nativeFile.path)
        target.parentFile.mkdirs()
        target.bytes = bundledNativeBytes(appDir, nativeFile)
        if (nativeFile.executable) target.setExecutable(true, false)
    }
}

// The image's own java with the launcher's JVM options and class path and -XX:AOTMode=on, which exits with an error
// instead of running without a stale or broken cache. Returns false when Jasper.cfg names no AOT cache.
def verifyAotCache = { File runtimeHome, File appDir ->
    String config = new File(appDir, 'Jasper.cfg').getText('UTF-8')
    if (!config.readLines().contains('java-options=' + aotCacheOption)) return false
    File cache = new File(appDir, 'jasper.aot')
    if (!cache.isFile() || cache.length() == 0) {
        throw new GradleException("Package verification failed: Jasper.cfg names an AOT cache, but ${cache} is missing or empty")
    }
    def result = executeNative(aotCheckCommand(new File(runtimeHome, 'bin/java'), config, appDir),
        'AOT cache check (java -XX:AOTMode=on): the JVM refuses the cache; train it again with trainAotCache')
    String output = result.stdout + result.stderr
    if (!output.contains('sharing')) {
        throw new GradleException("Package verification failed: java ran without class data sharing although it accepted the AOT cache\n${output}")
    }
    true
}

def stage = tasks.register('stagePackage', Sync) {
    group = 'distribution'
    description = 'Stages the application JAR, runtime dependencies, configuration example and package guide.'
    dependsOn(jarTask)
    from(jarTask.flatMap { it.archiveFile })
    from(configurations.runtimeClasspath)
    from(rootProject.file('config.example.toml'))
    from(rootProject.file('packaging/README.txt'))
    from(tasks.named('stagePlugins')) { into('plugins') }
    into(inputDirectory)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

apply from: rootProject.file('gradle/mac-native.gradle')
apply from: rootProject.file('gradle/mac-glass.gradle')
apply from: rootProject.file('gradle/mac-appearance.gradle')

def packageApp = tasks.register('packageApp') {
    group = 'distribution'
    description = 'Builds a native Jasper application image for the current host.'
    dependsOn(stage)
    inputs.dir(inputDirectory).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(nativeIcon).withPathSensitivity(PathSensitivity.RELATIVE)
    if (normalizedHost().os == 'macos') {
        inputs.file(macIconCatalog).withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file(rootProject.file('gradle/mac-launcher-identity.gradle'))
        inputs.file(launcher.map { it.metadata.installationPath.file('jmods/jdk.jpackage.jmod') })
        inputs.property('macIconName', macIconName)
    }
    inputs.property('mainClass', app.mainClass)
    inputs.property('jvmArgs', providers.provider { app.applicationDefaultJvmArgs.collect { it.toString() } })
    inputs.property('runtimeRootModules', providers.provider { runtimeRootModules(normalizedHost().os) })
    inputs.property('jlinkOptions', jlinkOptions)
    inputs.property('bundledNatives', providers.provider { bundledNatives(normalizedHost().os, normalizedHost().architecture).collect { it.toString() } })
    inputs.property('bundledNativeOptions', providers.provider { bundledNativeJvmOptions(normalizedHost().os) })
    inputs.property('localNetworkUsage', localNetworkUsage)
    inputs.property('version', version)
    inputs.property('host', providers.provider { normalizedHost().toString() })
    inputs.property('toolchainHome', launcher.map { it.metadata.installationPath.asFile.absolutePath })
    inputs.file(launcher.map { it.metadata.installationPath.file('release') })
    inputs.property('macosSdk', providers.provider { normalizedHost().os == 'macos' ? (installedMacSdkVersion() ?: 'none') : 'n/a' })
    outputs.dir(imageDirectory)
    outputs.file(markerFile)
    doLast {
        def context = nativeContext()
        File imageDir = imageDirectory.get().asFile
        File marker = markerFile.get().asFile
        delete(imageDir, marker)
        imageDir.mkdirs()
        List<String> args = [context.jpackage.absolutePath, '--type', 'app-image',
            '--name', 'Jasper', '--app-version', context.version,
            '--description', 'Jasper terminal', '--vendor', 'Jasper',
            '--input', inputDirectory.get().asFile.absolutePath, '--dest', imageDir.absolutePath,
            '--main-jar', jarTask.get().archiveFile.get().asFile.name,
            '--main-class', app.mainClass.get(),
            '--icon', nativeIcon.get().absolutePath,
            '--add-modules', runtimeRootModules(context.host.os).join(','),
            '--jlink-options', jlinkOptions]
        app.applicationDefaultJvmArgs.each { args.addAll(['--java-options', it.toString()]) }
        bundledNativeJvmOptions(context.host.os).each { args.addAll(['--java-options', it]) }
        if (context.host.os == 'macos') {
            args.addAll(['--mac-package-identifier', 'dev.jasper.app', '--mac-package-name', 'Jasper'])
        }
        try {
            executeNative(args, 'jpackage app-image')
            if (context.host.os == 'macos') {
                File image = new File(imageDir, 'Jasper.app')
                removePluginClasspath(new File(image, 'Contents/app/Jasper.cfg'))
                // After jpackage, which re-signs native inputs: these keep their vendor signatures, sealed by resignImage below.
                installBundledNatives(new File(image, 'Contents/app'), context.host)
                Files.copy(macIconCatalog.toPath(), new File(image, 'Contents/Resources/Assets.car').toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                executeNative(['/usr/bin/plutil', '-replace', 'CFBundleIconName', '-string', macIconName,
                    new File(image, 'Contents/Info.plist').absolutePath], 'plutil icon catalog name')
                executeNative(['/usr/bin/plutil', '-replace', 'NSLocalNetworkUsageDescription', '-string', localNetworkUsage,
                    new File(image, 'Contents/Info.plist').absolutePath], 'plutil local network usage')
                refreshLauncherSdk(image)
                File executable = new File(image, 'Contents/MacOS/Jasper')
                Files.write(executable.toPath(), macLauncherWithIdentity(Files.readAllBytes(executable.toPath()),
                    'dev.jasper.app', macLauncherTemplate(context.sdkHome)))
                // jpackage re-signs native inputs. Restore our already-signed bridge so the
                // same staged payload is verified byte-for-byte, then sign the outer bundle.
                Files.copy(new File(inputDirectory.get().asFile, 'libjasper-macos.dylib').toPath(),
                    new File(image, 'Contents/app/libjasper-macos.dylib').toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                Files.copy(new File(inputDirectory.get().asFile, 'libjasper-glass.dylib').toPath(),
                    new File(image, 'Contents/app/libjasper-glass.dylib').toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                Files.copy(new File(inputDirectory.get().asFile, 'libjasper-appearance.dylib').toPath(),
                    new File(image, 'Contents/app/libjasper-appearance.dylib').toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                resignImage(image)
            } else if (context.host.os == 'linux') {
                removePluginClasspath(new File(imageDir, 'Jasper/lib/app/Jasper.cfg'))
            } else {
                removePluginClasspath(new File(imageDir, 'Jasper/app/Jasper.cfg'))
                installBundledNatives(new File(imageDir, 'Jasper/app'), context.host)
            }
            marker.text = "${context.version} ${context.host.os} ${context.host.architecture}\n"
        } catch (Exception failure) {
            delete(imageDir, marker)
            throw failure
        }
    }
}

def verifyPackage = tasks.register('verifyPackage') {
    group = 'verification'
    description = 'Verifies the generated native image and bundled runtime without launching Jasper.'
    dependsOn(packageApp)
    // BundledNativesProbe lives in the test sources: verification tooling, never in the application jar.
    if (normalizedHost().os in ['macos', 'windows']) dependsOn(tasks.named('testClasses'))
    inputs.dir(inputDirectory).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(imageDirectory).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.upToDateWhen { false }
    doLast {
        def context = nativeContext()
        File image = new File(imageDirectory.get().asFile, context.host.os == 'macos' ? 'Jasper.app' : 'Jasper')
        def layoutFor = [
            macos: [app: 'Contents/app', runtime: 'Contents/runtime/Contents/Home', launcher: 'Contents/MacOS/Jasper'],
            windows: [app: 'app', runtime: 'runtime', launcher: 'Jasper.exe'],
            linux: [app: 'lib/app', runtime: 'lib/runtime', launcher: 'bin/Jasper'],
        ][context.host.os]
        File appDir = new File(image, layoutFor.app)
        File runtimeHome = new File(image, layoutFor.runtime)
        File nativeLauncher = new File(image, layoutFor.launcher)
        File config = new File(appDir, 'Jasper.cfg')
        [image, appDir, runtimeHome, nativeLauncher, config].each { candidate ->
            if (!candidate.exists()) throw new GradleException("Package verification failed: missing ${candidate}")
        }
        inputDirectory.get().asFile.eachFile { staged ->
            if (staged.isDirectory()) return
            File packaged = new File(appDir, staged.name)
            if (!packaged.isFile() || !Arrays.equals(Files.readAllBytes(staged.toPath()), Files.readAllBytes(packaged.toPath()))) {
                throw new GradleException("Package verification failed: staged file differs or is missing: ${staged.name}")
            }
        }
        File stagedPlugins = new File(inputDirectory.get().asFile, 'plugins')
        stagedPlugins.eachFileRecurse(groovy.io.FileType.FILES) { staged ->
            File packaged = new File(appDir, 'plugins/' + stagedPlugins.toPath().relativize(staged.toPath()).toString())
            if (!packaged.isFile() || !Arrays.equals(Files.readAllBytes(staged.toPath()), Files.readAllBytes(packaged.toPath()))) {
                throw new GradleException("Package verification failed: bundled plugin file differs or is missing: ${staged}")
            }
        }
        String cfg = config.getText('UTF-8')
        if (!cfg.contains("app.mainclass=${app.mainClass.get()}")) throw new GradleException('Package verification failed: wrong main class in Jasper.cfg')
        if (!cfg.contains('--enable-native-access=ALL-UNNAMED') || !cfg.contains('-Dapple.awt.application.name=Jasper')) {
            throw new GradleException('Package verification failed: required JVM options are missing from Jasper.cfg')
        }
        // Workspace glass is macOS-only: only the macOS launcher opens the JDK internals it reaches into.
        boolean glassOptions = cfg.contains('--add-opens=java.desktop/java.awt=ALL-UNNAMED') && cfg.contains('--add-exports=java.desktop/java.awt.peer=ALL-UNNAMED')
        boolean anyGlassOption = cfg.contains('--add-opens=java.desktop/java.awt=ALL-UNNAMED') || cfg.contains('--add-exports=java.desktop/java.awt.peer=ALL-UNNAMED')
        if (context.host.os == 'macos' && !glassOptions) throw new GradleException('Package verification failed: the workspace glass JVM options are missing from Jasper.cfg')
        if (context.host.os != 'macos' && anyGlassOption) throw new GradleException('Package verification failed: Jasper.cfg opens JDK internals for workspace glass, which exists only on macOS')
        // Part 2 adds no JVM tuning flags: only the application's own options (on macOS these include the workspace
        // glass options above), the bundled-native options and jpackage's app version may appear (trainAotCache adds
        // -XX:AOTCache on macOS).
        List<String> cfgOptions = cfg.readLines().findAll { it.startsWith('java-options=') }.collect { it.substring('java-options='.length()) }
        List<String> requiredOptions = app.applicationDefaultJvmArgs.collect { it.toString() } + bundledNativeJvmOptions(context.host.os)
        List<String> permittedOptions = requiredOptions + ["-Djpackage.app-version=${context.version}".toString()] +
            (context.host.os == 'macos' ? [aotCacheOption] : [])
        if (cfgOptions != cfgOptions.toUnique() || !cfgOptions.containsAll(requiredOptions) || !(cfgOptions - permittedOptions).isEmpty()) {
            throw new GradleException("Package verification failed: Jasper.cfg's JVM options are ${cfgOptions}; expected ${requiredOptions} and jpackage's app version")
        }
        String normalizedCfg = cfg.replace('\\', '/')
        configurations.runtimeClasspath.files.findAll { it.name.endsWith('.jar') }.each { dependency ->
            if (!normalizedCfg.contains("\$APPDIR/${dependency.name}")) throw new GradleException("Package verification failed: classpath omits ${dependency.name}")
        }
        // Plugins bring private copies of their libraries; on the application classpath they shadow them
        // through the context class loader (MINA's registrar lookup then fails with a ClassCastException).
        def pluginEntries = (normalizedCfg =~ /(?m)^app\.classpath=.*\/plugins\/.*$/).collect { it }
        if (pluginEntries) throw new GradleException("Package verification failed: plugin jars are on the application classpath\n${pluginEntries.join('\n')}")
        File release = new File(runtimeHome, 'release')
        String releaseText = release.getText('UTF-8')
        if (!(releaseText =~ /(?m)^JAVA_VERSION="25(?:\.|\")/)) {
            throw new GradleException('Package verification failed: bundled runtime release is not Java 25')
        }
        def releaseArchitectureMatcher = releaseText =~ /(?m)^OS_ARCH="([^"]+)"/
        String releaseArchitecture = releaseArchitectureMatcher.find() ? releaseArchitectureMatcher.group(1) : ''
        String normalizedReleaseArchitecture = releaseArchitecture in ['aarch64', 'arm64'] ? 'aarch64' :
                (releaseArchitecture in ['amd64', 'x86_64', 'x64'] ? 'x64' : releaseArchitecture)
        if (releaseArchitecture && normalizedReleaseArchitecture != context.host.architecture) throw new GradleException("Package verification failed: runtime architecture is ${releaseArchitecture}")
        // The trimmed runtime: exactly the documented modules, with a default CDS archive.
        def modulesMatcher = releaseText =~ /(?m)^MODULES="([^"]*)"/
        List<String> packagedModules = modulesMatcher.find() ? modulesMatcher.group(1).tokenize(' ').toSorted() : []
        List<String> expectedModules = runtimeModules(context.host.os)
        if (packagedModules != expectedModules) {
            throw new GradleException("Package verification failed: the runtime's modules differ from runtimeModules in gradle/packaging-support.gradle\n" +
                "missing: ${expectedModules - packagedModules}\nunexpected: ${packagedModules - expectedModules}")
        }
        File cdsArchive = new File(runtimeHome, context.host.os == 'windows' ? 'bin/server/classes.jsa' : 'lib/server/classes.jsa')
        if (!cdsArchive.isFile() || cdsArchive.length() == 0) {
            throw new GradleException("Package verification failed: the runtime has no default CDS archive at ${cdsArchive}")
        }
        // jdeps sees each jar's static module needs. Without this, a bundled plugin needing a module the runtime lacks
        // would fail with NoClassDefFoundError only in the packaged app.
        File jdeps = new File(context.sdkHome, "bin/jdeps${context.host.os == 'windows' ? '.exe' : ''}")
        List<File> applicationJars = appDir.listFiles().findAll { it.name.endsWith('.jar') }.sort { it.name }
        def requireModules = { List<File> jars, List<File> classPath, String what ->
            String output = executeNative([jdeps.absolutePath, '--multi-release', '25', '--ignore-missing-deps', '--print-module-deps',
                '--class-path', classPath*.absolutePath.join(File.pathSeparator)] + jars*.absolutePath, "jdeps for ${what}").stdout
            List<String> needed = output.readLines().findAll { it.trim() }.last().tokenize(',')*.trim()
            List<String> missing = needed - expectedModules
            if (missing) {
                throw new GradleException("Package verification failed: ${what} needs ${missing}, which the runtime lacks; " +
                    'add them to runtimeRootModules (gradle/packaging-support.gradle) and docs/plugin-authoring.md')
            }
        }
        requireModules(applicationJars, applicationJars, 'the application class path')
        new File(appDir, 'plugins').eachDir { plugin ->
            List<File> pluginJars = plugin.listFiles().findAll { it.name.endsWith('.jar') }.sort { it.name }
            requireModules(pluginJars, pluginJars + applicationJars, "bundled plugin ${plugin.name}")
        }
        File ptyJar = appDir.listFiles().find { it.name.startsWith('pty4j-') && it.name.endsWith('.jar') }
        File jnaJar = appDir.listFiles().find { it.name.startsWith('jna-') && !it.name.startsWith('jna-platform') && it.name.endsWith('.jar') }
        if (ptyJar == null || jnaJar == null) throw new GradleException('Package verification failed: pty4j or JNA dependency is missing')
        String nativeArchitecture = context.host.architecture == 'aarch64' ? 'aarch64' : 'x86-64'
        def nativePrefixes = [
            macos: [pty: 'resources/com/pty4j/native/darwin/', jna: "com/sun/jna/darwin-${nativeArchitecture}/"],
            windows: [pty: "resources/com/pty4j/native/win/${nativeArchitecture}/", jna: "com/sun/jna/win32-${nativeArchitecture}/"],
            linux: [pty: "resources/com/pty4j/native/linux/${nativeArchitecture}/", jna: "com/sun/jna/linux-${nativeArchitecture}/"],
        ][context.host.os]
        [[jar: ptyJar, prefix: nativePrefixes.pty], [jar: jnaJar, prefix: nativePrefixes.jna]].each { expected ->
            File nativeJar = expected.jar
            ZipFile zip = new ZipFile(nativeJar)
            try {
                boolean hasPayload = zip.entries().any { entry -> !entry.directory && entry.name.startsWith(expected.prefix) }
                if (!hasPayload) throw new GradleException("Package verification failed: ${nativeJar.name} lacks a host native payload")
            } finally { zip.close() }
        }
        // Bundled native libraries: present, byte-identical to their jar entries (so their vendor signatures hold),
        // executable where needed and, on macOS, validly signed.
        List<Map> natives = bundledNatives(context.host.os, context.host.architecture)
        natives.each { Map nativeFile ->
            File packaged = new File(appDir, nativeFile.path)
            if (!packaged.isFile() || !Arrays.equals(bundledNativeBytes(appDir, nativeFile), Files.readAllBytes(packaged.toPath()))) {
                throw new GradleException("Package verification failed: ${nativeFile.path} is missing or differs from ${nativeFile.entry}")
            }
            if (nativeFile.executable && !packaged.canExecute()) throw new GradleException("Package verification failed: ${nativeFile.path} is not executable")
            if (context.host.os == 'macos') {
                executeNative(['/usr/bin/codesign', '--verify', '--strict', packaged.absolutePath], "signature of ${nativeFile.path}")
            }
        }
        if (context.host.os == 'macos') {
            // Jasper's own signed bridges, staged and restored byte for byte by packageApp: the macOS bridge
            // (notifications and the Dock presence), workspace glass blur and system appearance observation.
            String expectedBridgeArchitecture = context.host.architecture == 'aarch64' ? 'arm64' : 'x86_64'
            [
                [label: 'native', name: 'libjasper-macos.dylib', symbols: ['Java_dev_jasper_app_platform_MacNotifications_bind',
                    'Java_dev_jasper_app_platform_MacNotifications_post', 'Java_dev_jasper_app_platform_MacNotifications_remove',
                    'Java_dev_jasper_app_platform_MacNotifications_removeAll', 'Java_dev_jasper_app_platform_MacDock_setRegular',
                    'Java_dev_jasper_app_platform_MacDock_watchPowerOff', 'Java_dev_jasper_app_platform_MacDock_poweringOffNow']],
                [label: 'glass', name: 'libjasper-glass.dylib', symbols: ['Java_dev_jasper_app_platform_MacGlass_setEffect']],
                [label: 'appearance', name: 'libjasper-appearance.dylib', symbols: ['Java_dev_jasper_app_platform_MacAppearance_watch',
                    'Java_dev_jasper_app_platform_MacAppearance_unwatch']],
            ].each { Map bridge ->
                File library = new File(appDir, bridge.name as String)
                if (!library.isFile()) throw new GradleException("Package verification failed: ${bridge.label} bridge missing")
                String bridgeArchitecture = executeNative(['/usr/bin/lipo', '-archs', library.absolutePath],
                    "${bridge.label} bridge architecture".toString()).stdout.trim()
                if (bridgeArchitecture != expectedBridgeArchitecture) throw new GradleException("Package verification failed: ${bridge.label} bridge architecture mismatch")
                executeNative(['/usr/bin/codesign', '--verify', '--strict', library.absolutePath], "${bridge.label} bridge signature".toString())
                String bridgeSymbols = executeNative(['/usr/bin/nm', '-gU', library.absolutePath], "${bridge.label} bridge symbols".toString()).stdout
                bridge.symbols.each { String symbol ->
                    if (!bridgeSymbols.contains('_' + symbol)) throw new GradleException("Package verification failed: ${bridge.label} bridge lacks ${symbol}")
                }
            }
            File plist = new File(image, 'Contents/Info.plist')
            if (!plist.isFile()) throw new GradleException("Package verification failed: missing ${plist}")
            def identifier = executeNative(['/usr/bin/plutil', '-extract', 'CFBundleIdentifier', 'raw', '-o', '-', plist.absolutePath], 'plutil identifier').stdout.trim()
            def bundleVersion = executeNative(['/usr/bin/plutil', '-extract', 'CFBundleShortVersionString', 'raw', '-o', '-', plist.absolutePath], 'plutil version').stdout.trim()
            if (identifier != 'dev.jasper.app' || bundleVersion != context.version) throw new GradleException("Package verification failed: plist identity/version is ${identifier}/${bundleVersion}")
            def localNetwork = executeNative(['/usr/bin/plutil', '-extract', 'NSLocalNetworkUsageDescription', 'raw', '-o', '-', plist.absolutePath], 'plutil local network').stdout.trim()
            if (localNetwork != localNetworkUsage) throw new GradleException("Package verification failed: plist local network usage description is '${localNetwork}'")
            String iconName = executeNative(['/usr/bin/plutil', '-extract', 'CFBundleIconFile', 'raw', '-o', '-', plist.absolutePath], 'plutil icon').stdout.trim()
            if (!iconName.endsWith('.icns')) iconName += '.icns'
            File packagedIcon = new File(image, "Contents/Resources/${iconName}")
            if (!packagedIcon.isFile() || !Arrays.equals(Files.readAllBytes(nativeIcon.get().toPath()), Files.readAllBytes(packagedIcon.toPath()))) {
                throw new GradleException('Package verification failed: bundled macOS icon differs from the official icon')
            }
            String catalogName = executeNative(['/usr/bin/plutil', '-extract', 'CFBundleIconName', 'raw', '-o', '-', plist.absolutePath], 'plutil icon catalog name').stdout.trim()
            File packagedCatalog = new File(image, 'Contents/Resources/Assets.car')
            if (catalogName != macIconName || !packagedCatalog.isFile() ||
                    !Arrays.equals(Files.readAllBytes(macIconCatalog.toPath()), Files.readAllBytes(packagedCatalog.toPath()))) {
                throw new GradleException('Package verification failed: named macOS icon catalog is missing or differs from the official catalog')
            }
            String fileOutput = executeNative(['/usr/bin/file', nativeLauncher.absolutePath, new File(runtimeHome, 'bin/java').absolutePath], 'native architecture inspection').stdout
            String architectureNeedle = context.host.architecture == 'aarch64' ? 'arm64' : 'x86_64'
            if (!fileOutput.contains(architectureNeedle)) throw new GradleException("Package verification failed: native binaries are not ${architectureNeedle}\n${fileOutput}")
            byte[] executable = Files.readAllBytes(nativeLauncher.toPath())
            if (!Arrays.equals(executable, macLauncherWithIdentity(executable, identifier, macLauncherTemplate(context.sdkHome)))) {
                throw new GradleException('Package verification failed: launcher lacks its app-specific Mach-O UUID; macOS may apply another app\'s Local Network permission')
            }
            executeNative(['/usr/bin/codesign', '--verify', '--deep', '--strict', image.absolutePath], 'codesign verification')
            if (verifyAotCache(runtimeHome, appDir)) {
                logger.lifecycle("AOT cache accepted (-XX:AOTMode=on): ${new File(appDir, 'jasper.aot').length().intdiv(1024 * 1024)} MB")
            } else {
                logger.lifecycle('No AOT cache in this image: packageDist and -Pjasper.aot=true train one')
            }
            String sdk = installedMacSdkVersion()
            if (sdk == null) {
                logger.lifecycle('Launcher SDK check skipped: Xcode command line tools not found')
            } else {
                def build = launcherBuildVersion(nativeLauncher)
                if (build.sdk != sdk) throw new GradleException("Package verification failed: the launcher records SDK ${build.sdk}, not the installed SDK ${sdk}")
                if ((build.sdk.tokenize('.')[0] as int) < 26) {
                    logger.warn("Launcher SDK ${build.sdk} predates macOS 26: the app shows the pre-26 window controls; install Xcode 26 or later")
                }
            }
        }
        if (context.host.os == 'windows') {
            // Read the PE header rather than trusting the toolchain: an x64 image on Windows on Arm runs under
            // emulation, JIT-compiled code included. IMAGE_FILE_HEADER.Machine is 0x8664 for x64, 0xAA64 for ARM64.
            int expectedMachine = context.host.architecture == 'aarch64' ? 0xAA64 : 0x8664
            [nativeLauncher, new File(runtimeHome, 'bin/java.exe'), new File(runtimeHome, 'bin/server/jvm.dll')].each { binary ->
                byte[] header = new byte[4096]
                int read = binary.withInputStream { it.readNBytes(header, 0, header.length) }
                ByteBuffer pe = ByteBuffer.wrap(header, 0, read).order(ByteOrder.LITTLE_ENDIAN)
                int offset = read >= 0x40 ? pe.getInt(0x3C) : -1
                boolean valid = read >= 2 && header[0] == ('M' as char) && header[1] == ('Z' as char) &&
                    offset >= 0 && offset + 6 <= read && pe.getInt(offset) == 0x00004550
                int machine = valid ? (pe.getShort(offset + 4) & 0xFFFF) : -1
                if (machine != expectedMachine) {
                    throw new GradleException(String.format(Locale.ROOT,
                        'Package verification failed: %s is not a %s PE binary (machine 0x%04X)', binary, context.host.architecture, machine))
                }
            }
            // jpackage embeds the ICO's PNG frames in the executable's native resources.
            // Inspect bytes without running the launcher or depending on image-conversion tools.
            byte[] ico = Files.readAllBytes(nativeIcon.get().toPath())
            ByteBuffer directory = ByteBuffer.wrap(ico).order(ByteOrder.LITTLE_ENDIAN)
            if (directory.getShort() != 0 || directory.getShort() != 1) {
                throw new GradleException('Package verification failed: invalid Windows ICO header')
            }
            int count = Short.toUnsignedInt(directory.getShort())
            String executableBytes = new String(Files.readAllBytes(nativeLauncher.toPath()), StandardCharsets.ISO_8859_1)
            for (int i = 0; i < count; i++) {
                directory.position(6 + i * 16 + 8)
                int length = directory.getInt(), offset = directory.getInt()
                String frameBytes = new String(ico, offset, length, StandardCharsets.ISO_8859_1)
                if (!executableBytes.contains(frameBytes)) {
                    throw new GradleException("Package verification failed: Windows launcher omits official icon frame ${i}")
                }
            }
        }
        if (context.host.os == 'linux') {
            // Read the ELF header rather than trusting `file`: e_machine at offset 18 is 0x3E for x86-64, 0xB7 for AArch64.
            int expectedMachine = context.host.architecture == 'aarch64' ? 0xB7 : 0x3E
            [nativeLauncher, new File(runtimeHome, 'bin/java')].each { binary ->
                byte[] header = new byte[20]
                binary.withInputStream { it.readNBytes(header, 0, header.length) }
                boolean elf = header[0] == 0x7F && header[1] == ('E' as char) && header[2] == ('L' as char) && header[3] == ('F' as char)
                int machine = ByteBuffer.wrap(header, 18, 2).order(ByteOrder.LITTLE_ENDIAN).getShort() & 0xFFFF
                if (!elf || machine != expectedMachine) throw new GradleException("Package verification failed: ${binary} is not a ${context.host.architecture} ELF binary")
            }
            if (!nativeLauncher.canExecute()) throw new GradleException("Package verification failed: ${nativeLauncher} is not executable")
            File packagedIcon = new File(image, 'lib/Jasper.png')
            if (!packagedIcon.isFile() || Files.mismatch(nativeIcon.get().toPath(), packagedIcon.toPath()) != -1L) {
                throw new GradleException('Package verification failed: bundled Linux icon differs from the official icon')
            }
        }
        File bundledJava = new File(runtimeHome, "bin/java${context.host.os == 'windows' ? '.exe' : ''}")
        def javaVersion = executeNative([bundledJava.absolutePath, '-XshowSettings:properties', '-version'], 'bundled java -version')
        String versionOutput = javaVersion.stdout + javaVersion.stderr
        if (!versionOutput.contains('25.') || !versionOutput.toLowerCase(Locale.ROOT).contains('jbr-')) {
            throw new GradleException("Package verification failed: unexpected bundled java -version output\n${versionOutput}")
        }
        def runtimeArchitectureMatcher = versionOutput =~ /(?m)^\s*os\.arch = ([^\s]+)\s*$/
        String runtimeArchitecture = runtimeArchitectureMatcher.find() ? runtimeArchitectureMatcher.group(1).toLowerCase(Locale.ROOT) : ''
        runtimeArchitecture = runtimeArchitecture in ['aarch64', 'arm64'] ? 'aarch64' :
                (runtimeArchitecture in ['amd64', 'x86_64', 'x64'] ? 'x64' : runtimeArchitecture)
        if (runtimeArchitecture != context.host.architecture) {
            throw new GradleException("Package verification failed: bundled Java architecture is ${runtimeArchitecture ?: 'unknown'}")
        }
        def sharing = executeNative([bundledJava.absolutePath, '-Xshare:on', '-version'], 'bundled java with its default CDS archive (-Xshare:on)')
        if (!(sharing.stdout + sharing.stderr).contains('sharing')) {
            throw new GradleException("Package verification failed: the bundled java reports no class data sharing\n${sharing.stderr}")
        }
        long runtimeBytes = 0
        runtimeHome.eachFileRecurse(groovy.io.FileType.FILES) { runtimeBytes += it.length() }
        logger.lifecycle("Runtime: ${packagedModules.size()} modules, ${runtimeBytes.intdiv(1024 * 1024)} MB, " +
            "default CDS archive ${cdsArchive.length().intdiv(1024 * 1024)} MB")
        if (natives) {
            // Headless: the image's java, launcher options and class path load every bundled library and start one
            // process through pty4j. -Xlog:library shows where the JVM loaded each library from, the probe prints the
            // files pty4j resolved, and the scratch home and temporary folders must stay empty (nothing extracted).
            File scratch = new File(temporaryDir, 'natives-probe')
            delete(scratch)
            ['home', 'tmp'].each { new File(scratch, it).mkdirs() }
            List<String> probe = ([bundledJava.absolutePath] +
                launcherJavaOptions(cfg, appDir).findAll { !it.startsWith('-XX:AOTCache=') } +
                ['-Djava.awt.headless=true', "-Duser.home=${new File(scratch, 'home')}", "-Djava.io.tmpdir=${new File(scratch, 'tmp')}",
                 "-Djna.tmpdir=${new File(scratch, 'jna')}", "-Dpty4j.tmpdir=${new File(scratch, 'pty4j')}", '-Xlog:library=info:stdout',
                 '-cp', (launcherClasspath(cfg, appDir) + sourceSets.test.output.classesDirs.files*.absolutePath).join(File.pathSeparator),
                 'dev.jasper.app.architecture.BundledNativesProbe'])*.toString()
            String output = executeNative(probe, 'bundled natives probe (headless)').stdout
            if (!output.contains('bundled natives probe passed')) throw new GradleException("Package verification failed: the natives probe did not finish\n${output}")
            Set<File> loaded = loadedLibraries(output).collect { new File(it).canonicalFile } as Set
            natives.findAll { it.loaded }.each { Map nativeFile ->
                if (!loaded.contains(new File(appDir, nativeFile.path).canonicalFile)) {
                    throw new GradleException("Package verification failed: the JVM did not load ${nativeFile.path} from the image; it loaded\n${loaded.join('\n')}")
                }
            }
            File nativeRoot = new File(appDir, 'native').canonicalFile
            def resolved = (output =~ /(?m)^pty4j (\S+) (.+)$/).collect { [name: it[1], file: new File(it[2].trim()).canonicalFile] }
            if (!resolved) throw new GradleException("Package verification failed: the natives probe reported no pty4j files\n${output}")
            resolved.each { pty ->
                if (!pty.file.isFile() || !pty.file.path.startsWith(nativeRoot.path + File.separator)) {
                    throw new GradleException("Package verification failed: pty4j resolved ${pty.name} to ${pty.file}, not a file under ${nativeRoot}")
                }
            }
            List<File> extracted = []
            scratch.eachFileRecurse(groovy.io.FileType.FILES) { extracted << it }
            if (extracted) throw new GradleException("Package verification failed: loading the natives extracted ${extracted}")
            logger.lifecycle("Bundled natives load from ${nativeRoot}")
        }
        logger.lifecycle("Verified Jasper ${context.version} ${context.host.os}-${context.host.architecture} image at ${image}")
    }
}

if (normalizedHost().os == 'windows') {
    if (aotRequested) throw new GradleException('-Pjasper.aot=true: AOT training runs on macOS only')
    // Stable across releases: changing this would install a second product instead of upgrading.
    def upgradeUuid = 'c035e743-82bf-4ca6-aacf-5512d9831a09'
    def installerVerifier = rootProject.file('packaging/windows/Verify-Installer.ps1')
    tasks.register('packageInstaller') {
        group = 'distribution'
        description = 'Creates and verifies a per-user Windows setup wizard (requires WiX on PATH).'
        dependsOn(verifyPackage)
        inputs.dir(imageDirectory).withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file(installerVerifier).withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.property('version', version)
        inputs.property('upgradeUuid', upgradeUuid)
        outputs.file(version.map { new File(distributionDirectory.get().asFile, "Jasper-${it}-windows-${normalizedHost().architecture}-setup.exe") })
        doLast {
            def context = nativeContext()
            File distDir = distributionDirectory.get().asFile
            distDir.mkdirs()
            File artifact = new File(distDir, "Jasper-${context.version}-windows-${context.host.architecture}-setup.exe")
            File temporary = new File(packagingRoot.get().asFile, 'installer-work')
            delete(artifact, temporary)
            temporary.mkdirs()
            try {
                File output = new File(temporary, 'output')
                File work = new File(temporary, 'jpackage')
                executeNative([context.jpackage.absolutePath, '--type', 'exe', '--name', 'Jasper',
                    '--app-version', context.version, '--vendor', 'Jasper', '--description', 'Jasper terminal',
                    '--icon', nativeIcon.get().absolutePath,
                    '--app-image', new File(imageDirectory.get().asFile, 'Jasper').absolutePath,
                    '--dest', output.absolutePath, '--temp', work.absolutePath,
                    '--win-per-user-install', '--install-dir', 'Jasper', '--win-dir-chooser',
                    '--win-menu', '--win-menu-group', 'Jasper', '--win-shortcut', '--win-shortcut-prompt',
                    '--win-upgrade-uuid', upgradeUuid], 'jpackage Windows setup (install WiX and add it to PATH)')
                File generated = output.listFiles()?.find { it.name.endsWith('.exe') }
                // WiX also leaves a working copy (wixobj/a.msi); verify the final payload
                // that jpackage's EXE bundler embeds, not that intermediate copy.
                File msi = new File(work, "msi/Jasper-${context.version}.msi")
                if (generated == null || !msi.isFile()) {
                    throw new GradleException("Unexpected jpackage output: setup=${generated}, missing MSI=${msi}; inspect ${temporary}")
                }
                def verification = executeNative(['powershell.exe', '-NoProfile', '-NonInteractive',
                    '-ExecutionPolicy', 'Bypass', '-File', installerVerifier.absolutePath,
                    '-MsiPath', msi.absolutePath, '-Version', context.version,
                    '-UpgradeUuid', upgradeUuid], 'Windows installer verification')
                logger.lifecycle(verification.stdout.trim())
                Files.move(generated.toPath(), artifact.toPath())
            } finally {
                // Keep failed build inputs for diagnosis; never publish an unverified setup.
                if (artifact.isFile()) delete(temporary)
            }
            logger.lifecycle("Created ${artifact}")
        }
    }
    tasks.register('packageDist', Zip) {
        group = 'distribution'
        description = 'Creates the portable Windows distribution after verifying its image.'
        dependsOn(verifyPackage)
        archiveFileName = version.map { "Jasper-${it}-windows-${normalizedHost().architecture}.zip" }
        destinationDirectory = distributionDirectory
        from(imageDirectory)
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        doFirst { nativeContext() }
    }
} else if (normalizedHost().os == 'linux') {
    if (aotRequested) throw new GradleException('-Pjasper.aot=true: AOT training runs on macOS only')
    // jpackage builds only for the host, so each architecture needs its own Linux build machine.
    // Each package format names the architecture its own way.
    def linuxArchitecture = [
        x64: [deb: 'amd64', rpm: 'x86_64'],
        aarch64: [deb: 'arm64', rpm: 'aarch64'],
    ][normalizedHost().architecture]
    def installRoot = '/opt/jasper'

    // jpackage's rpm spec turns rpmbuild's dependency scan off and asks the host's rpm database instead,
    // which is empty on a Debian-family build machine. Require the image's external shared libraries by
    // soname, as rpmbuild itself would: every rpm distribution resolves "libX11.so.6()(64bit)".
    def rpmLibraryRequirements = { File image ->
        List<File> elfFiles = []
        image.eachFileRecurse(groovy.io.FileType.FILES) { candidate ->
            byte[] magic = new byte[4]
            int read = candidate.withInputStream { it.readNBytes(magic, 0, 4) }
            if (read == 4 && magic[0] == 0x7F && magic[1] == ('E' as char) && magic[2] == ('L' as char) && magic[3] == ('F' as char)) {
                elfFiles << candidate
            }
        }
        Set<String> bundled = elfFiles.collect { it.name } as Set
        Set<String> needed = new TreeSet<>()
        elfFiles.each { elf ->
            String dynamic = executeNative(['readelf', '--dynamic', '--wide', elf.absolutePath], "readelf ${elf.name} (install binutils)").stdout
            (dynamic =~ /\(NEEDED\)\s+Shared library: \[([^\]]+)\]/).each { needed << it[1] }
        }
        (needed - bundled).collect { "${it}()(64bit)".toString() }
    }

    // jpackage's install scripts register the menu entry with xdg-desktop-menu under `set -e`. xdg-desktop-menu fails
    // unless /usr/share/applications (or /usr/local/...) and /usr/share/desktop-directories already exist, as on
    // minimal and headless systems, and the install then fails and leaves the package unconfigured. Rewrite the selected
    // JBR's own templates so the scripts create those directories and never fail the install or removal over the menu
    // entry. Every other line stays jpackage's; a template without the expected placeholder fails the build.
    String menuDirectories = 'mkdir -p /usr/share/applications /usr/share/desktop-directories'
    Map<String, String> menuCommands = [
        DESKTOP_COMMANDS_INSTALL: "jasper_menu_install () {\nDESKTOP_COMMANDS_INSTALL\n}\n${menuDirectories}\n" +
            'jasper_menu_install "$@" || echo "jasper: the desktop menu entry was not registered" >&2',
        DESKTOP_COMMANDS_UNINSTALL: 'jasper_menu_uninstall () {\nDESKTOP_COMMANDS_UNINSTALL\n}\n' +
            'jasper_menu_uninstall "$@" || echo "jasper: the desktop menu entry was not removed" >&2',
    ]
    def writeInstallScripts = { File sdkHome, File resources, String type ->
        // Resource-directory names jpackage looks for, and the placeholders each template must contain.
        Map<String, List> overrides = type == 'deb' ?
            ['template.postinst': ['postinst', ['DESKTOP_COMMANDS_INSTALL']], 'template.prerm': ['prerm', ['DESKTOP_COMMANDS_UNINSTALL']]] :
            ['template.spec': ['jasper.spec', ['DESKTOP_COMMANDS_INSTALL', 'DESKTOP_COMMANDS_UNINSTALL']]]
        new ZipFile(new File(sdkHome, 'jmods/jdk.jpackage.jmod')).withCloseable { archive ->
            overrides.each { template, override ->
                def entry = archive.getEntry("classes/jdk/jpackage/internal/resources/${template}")
                if (entry == null) throw new GradleException("The JBR SDK's jpackage has no Linux ${template}")
                List<String> lines = archive.getInputStream(entry).withCloseable { new String(it.readAllBytes(), StandardCharsets.UTF_8) }.split('\n', -1) as List
                override[1].each { String placeholder ->
                    if (lines.count { it == placeholder } != 1) throw new GradleException("jpackage's ${template} no longer has exactly one ${placeholder} line; review the install-script override")
                    lines[lines.indexOf(placeholder)] = menuCommands[placeholder]
                }
                new File(resources, override[0]).setText(lines.join('\n'), 'UTF-8')
            }
        }
    }

    // Checks the generated maintainer scripts: jpackage's menu commands inside the wrappers, all placeholders filled.
    def verifyInstallScripts = { String scripts, String label ->
        [menuDirectories, 'jasper_menu_install "$@" || ', 'jasper_menu_uninstall "$@" || ',
         'xdg-desktop-menu install /opt/jasper/lib/jasper-Jasper.desktop', 'xdg-desktop-menu uninstall'].each { expected ->
            if (!scripts.contains(expected)) throw new GradleException("${label} verification failed: install scripts lack '${expected}'\n${scripts}")
        }
        if (scripts.contains('DESKTOP_COMMANDS_')) throw new GradleException("${label} verification failed: install scripts keep an unfilled placeholder\n${scripts}")
    }

    // Compares an unpacked package with the verified image (same bytes, no lost executable bits) and checks the menu entry.
    // jpackage rewrites its own app-image metadata, lib/app/.jpackage.xml, when it builds a package.
    def verifyUnpackedPackage = { File image, File unpacked, String label ->
        File installed = new File(unpacked, installRoot.substring(1))
        File jpackageMetadata = new File(image, 'lib/app/.jpackage.xml')
        image.eachFileRecurse(groovy.io.FileType.FILES) { expected ->
            if (expected == jpackageMetadata) return
            File actual = new File(installed, image.toPath().relativize(expected.toPath()).toString())
            if (!actual.isFile() || Files.mismatch(expected.toPath(), actual.toPath()) != -1L) {
                throw new GradleException("${label} verification failed: ${actual} differs from the verified image or is missing")
            }
            if (expected.canExecute() && !actual.canExecute()) throw new GradleException("${label} verification failed: ${actual} lost its executable bit")
        }
        File desktop = new File(installed, 'lib').listFiles()?.find { it.name.endsWith('.desktop') }
        String entry = desktop?.getText('UTF-8') ?: ''
        if (!entry.contains("${installRoot}/bin/Jasper") || !entry.contains("${installRoot}/lib/Jasper.png") || !entry.contains('TerminalEmulator')) {
            throw new GradleException("${label} verification failed: the desktop entry is missing or incomplete\n${entry}")
        }
    }

    def linuxPackage = { String type, String taskName, String requirement ->
        String packageArchitecture = linuxArchitecture[type]
        tasks.register(taskName) {
            group = 'distribution'
            description = "Creates and verifies the Linux .${type} package for this host's architecture (requires ${requirement})."
            dependsOn(verifyPackage)
            inputs.dir(imageDirectory).withPathSensitivity(PathSensitivity.RELATIVE)
            inputs.property('version', version)
            outputs.file(version.map { new File(distributionDirectory.get().asFile, "Jasper-${it}-linux-${packageArchitecture}.${type}") })
            doLast {
                def context = nativeContext()
                File image = new File(imageDirectory.get().asFile, 'Jasper')
                File distDir = distributionDirectory.get().asFile
                distDir.mkdirs()
                File artifact = new File(distDir, "Jasper-${context.version}-linux-${packageArchitecture}.${type}")
                File temporary = new File(packagingRoot.get().asFile, "${type}-work")
                delete(artifact, temporary)
                temporary.mkdirs()
                try {
                    File output = new File(temporary, 'output')
                    // Packaging an app image, jpackage ignores --icon and installs its generic 32px Java icon
                    // as lib/Jasper.png (the menu entry's icon) unless the resource directory supplies one.
                    File resources = new File(temporary, 'resources')
                    resources.mkdirs()
                    Files.copy(nativeIcon.get().toPath(), new File(resources, 'Jasper.png').toPath())
                    writeInstallScripts(context.sdkHome, resources, type)
                    List<String> args = [context.jpackage.absolutePath, '--type', type, '--name', 'Jasper',
                        '--app-version', context.version, '--vendor', 'Jasper', '--description', 'Jasper terminal',
                        '--about-url', 'https://github.com/an0nn30/Jasper',
                        '--icon', nativeIcon.get().absolutePath,
                        '--app-image', image.absolutePath, '--resource-dir', resources.absolutePath,
                        '--dest', output.absolutePath, '--temp', new File(temporary, 'jpackage').absolutePath,
                        '--linux-package-name', 'jasper', '--linux-shortcut',
                        '--linux-menu-group', 'System;TerminalEmulator;',
                        '--linux-app-category', type == 'deb' ? 'x11' : 'Applications/System']
                    if (type == 'rpm') {
                        List<String> requirements = rpmLibraryRequirements(image)
                        if (requirements) args.addAll(['--linux-package-deps', requirements.join(', ')])
                    }
                    executeNative(args, "jpackage Linux .${type} (install ${requirement})")
                    File generated = output.listFiles()?.find { it.name.endsWith(".${type}") }
                    if (generated == null) throw new GradleException("jpackage completed without producing a .${type}; inspect ${temporary}")

                    // Check the package's identity, then unpack it without installing and compare it with the image.
                    File unpacked = new File(temporary, 'unpacked')
                    unpacked.mkdirs()
                    String identity
                    if (type == 'deb') {
                        String fields = executeNative(['dpkg-deb', '--field', generated.absolutePath, 'Package', 'Version', 'Architecture'], 'dpkg-deb --field').stdout
                        identity = ['Package', 'Version', 'Architecture'].collect { name ->
                            def field = fields =~ /(?m)^${name}: (\S+)$/
                            field.find() ? field.group(1) : ''
                        }.join(' ')
                        executeNative(['dpkg-deb', '--extract', generated.absolutePath, unpacked.absolutePath], 'dpkg-deb --extract')
                        verifyInstallScripts(['postinst', 'prerm'].collect { script ->
                            executeNative(['dpkg-deb', '--info', generated.absolutePath, script], "dpkg-deb --info ${script}").stdout
                        }.join('\n'), '.deb')
                    } else {
                        identity = executeNative(['rpm', '--query', '--package', '--queryformat', '%{NAME} %{VERSION} %{ARCH}', generated.absolutePath], 'rpm --query').stdout.trim()
                        executeNative(['bash', '-c', 'set -o pipefail; cd "$1" && rpm2cpio "$2" | cpio --extract --make-directories --preserve-modification-time --quiet',
                            'bash', unpacked.absolutePath, generated.absolutePath], 'rpm2cpio | cpio (install rpm2cpio and cpio)')
                        verifyInstallScripts(executeNative(['rpm', '--query', '--package', '--scripts', generated.absolutePath], 'rpm --scripts').stdout, '.rpm')
                    }
                    def expectedIdentity = ~/^jasper ${java.util.regex.Pattern.quote(context.version)}(-[0-9]+)? ${packageArchitecture}$/
                    if (!(identity ==~ expectedIdentity)) throw new GradleException(".${type} verification failed: package identity is '${identity}'")
                    verifyUnpackedPackage(image, unpacked, ".${type}")
                    Files.move(generated.toPath(), artifact.toPath())
                } finally {
                    // Keep failed build inputs for diagnosis; never publish an unverified package.
                    if (artifact.isFile()) delete(temporary)
                }
                logger.lifecycle("Created ${artifact}")
            }
        }
    }
    def packageDeb = linuxPackage('deb', 'packageDeb', 'dpkg-deb and fakeroot')
    def packageRpm = linuxPackage('rpm', 'packageRpm', 'rpmbuild, readelf, rpm2cpio and cpio')
    tasks.register('packageDist') {
        group = 'distribution'
        description = 'Creates the Linux .deb and .rpm packages after verifying their image.'
        dependsOn(packageDeb, packageRpm)
    }
} else {
    def aotTrainingDirectory = packagingRoot.map { it.dir('aot-training') }
    // Launches the image once: a Jasper window for a few seconds, without a Dock icon. Agents ask the user first.
    // Training changes packageApp's output, so the next packageApp rebuilds the image from scratch, untrained.
    def trainAotCache = tasks.register('trainAotCache') {
        group = 'distribution'
        description = 'Launches the packaged app once (a window for a few seconds, no Dock icon) to record its AOT cache.'
        dependsOn(packageApp)
        doLast {
            File image = new File(imageDirectory.get().asFile, 'Jasper.app')
            File appDir = new File(image, 'Contents/app')
            File config = new File(appDir, 'Jasper.cfg')
            if (config.readLines('UTF-8').contains('java-options=' + aotCacheOption)) {
                throw new GradleException("${image} already has an AOT cache; packageApp rebuilds the image before training")
            }
            File cache = runAotTraining(new File(image, 'Contents/MacOS/Jasper'), aotTrainingDirectory.get().asFile, 90, 300)
            Files.copy(cache.toPath(), new File(appDir, 'jasper.aot').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            config.setText(withJavaOption(config.getText('UTF-8'), aotCacheOption), 'UTF-8')
            resignImage(image)
            if (!verifyAotCache(new File(image, 'Contents/runtime/Contents/Home'), appDir)) {
                throw new GradleException('AOT training left Jasper.cfg without the cache option')
            }
            logger.lifecycle("Trained the AOT cache: ${new File(appDir, 'jasper.aot').length().intdiv(1024 * 1024)} MB in ${appDir}")
        }
    }
    verifyPackage.configure { mustRunAfter(trainAotCache) }
    if (aotRequested) {
        packageApp.configure { finalizedBy(trainAotCache) }
        verifyPackage.configure { dependsOn(trainAotCache) }
    }
    tasks.register('packageDist') {
        group = 'distribution'
        description = 'Trains the AOT cache, verifies the image and creates the macOS DMG (launches Jasper once: ask first).'
        dependsOn(trainAotCache, verifyPackage)
        inputs.dir(imageDirectory).withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.property('version', version)
        outputs.files(version.map { new File(distributionDirectory.get().asFile, "Jasper-${it}-macos-${normalizedHost().architecture}.dmg") })
        doLast {
            def context = nativeContext()
            File image = new File(imageDirectory.get().asFile, 'Jasper.app')
            File distDir = distributionDirectory.get().asFile
            distDir.mkdirs()
            File artifact = new File(distDir, "Jasper-${context.version}-macos-${context.host.architecture}.dmg")
            File temporary = new File(packagingRoot.get().asFile, 'dist-dmg-work')
            File volume = new File(temporary, 'volume')
            File mount = new File(temporary, 'mount')
            def detach = { File target ->
                detachMount(target) { List<String> command ->
                    try {
                        executeNative(command, 'hdiutil detach')
                        return 0
                    } catch (GradleException refused) {
                        logger.warn(refused.message)
                        return 1
                    }
                }
            }
            String recovery = "hdiutil detach -force ${mount}".toString()
            // A killed or failed earlier run can leave its DMG mounted read-only, which delete(temporary) cannot remove.
            if (new File(mount, 'Jasper.app').exists() && !detach(mount)) {
                throw new GradleException("An earlier packageDist left ${mount} mounted and it will not detach; run ${recovery}, then try again")
            }
            delete(artifact)
            delete(temporary)
            volume.mkdirs()
            mount.mkdirs()
            String stillMounted = null
            try {
                // jpackage --type dmg copies the image without modification times (Files.copy without COPY_ATTRIBUTES),
                // and the JVM then refuses the AOT cache and the CDS archive. ditto and hdiutil keep the times.
                executeNative(['/usr/bin/ditto', image.absolutePath, new File(volume, 'Jasper.app').absolutePath], 'ditto Jasper.app into the DMG folder')
                Files.createSymbolicLink(new File(volume, 'Applications').toPath(), new File('/Applications').toPath())
                int attempt = 0
                while (true) {
                    attempt++
                    try {
                        executeNative(['/usr/bin/hdiutil', 'create', '-volname', 'Jasper', '-srcfolder', volume.absolutePath,
                            '-fs', 'HFS+', '-format', 'UDZO', '-ov', artifact.absolutePath], 'hdiutil create')
                        break
                    } catch (GradleException busy) {
                        // hdiutil sometimes reports a busy resource; jpackage retries for the same reason.
                        if (attempt == 3) throw busy
                        Thread.sleep(2000)
                    }
                }
                executeNative(['/usr/bin/hdiutil', 'verify', artifact.absolutePath], 'hdiutil verify')
                // Check what a user installs: mounted read-only and hidden from Finder, no window opens.
                executeNative(['/usr/bin/hdiutil', 'attach', artifact.absolutePath, '-readonly', '-nobrowse', '-noautoopen',
                    '-mountpoint', mount.absolutePath], 'hdiutil attach')
                try {
                    File installed = new File(mount, 'Jasper.app')
                    List<String> changed = modificationTimeMismatches(new File(image, 'Contents/app'), new File(installed, 'Contents/app'))
                    if (changed) throw new GradleException("DMG verification failed: modification times differ for ${changed.take(10)}; the JVM would refuse the AOT cache")
                    executeNative(['/usr/bin/codesign', '--verify', '--deep', '--strict', installed.absolutePath], 'codesign verification of the DMG copy')
                    if (!verifyAotCache(new File(installed, 'Contents/runtime/Contents/Home'), new File(installed, 'Contents/app'))) {
                        throw new GradleException('DMG verification failed: the app in the DMG has no AOT cache')
                    }
                } finally {
                    if (!detach(mount)) {
                        stillMounted = "Could not detach ${mount}, a hidden read-only mount that makes the next packageDist and clean fail; run ${recovery}".toString()
                    }
                }
            } catch (Exception failure) {
                // The check failure propagates; a detach failure on top of it is reported here rather than masking it.
                if (stillMounted != null) logger.error(stillMounted)
                delete(artifact)
                throw failure
            } finally {
                if (!new File(mount, 'Jasper.app').exists()) delete(temporary)
            }
            // The checks passed and the DMG was written; only the mount is left to clean up by hand.
            if (stillMounted != null) throw new GradleException("${stillMounted}. The DMG itself was written to ${artifact}.")
            logger.lifecycle("Created ${artifact}")
        }
    }
}
