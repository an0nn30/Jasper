}
tasks.named('check') { dependsOn(testDesktopPackagePolicy) }

tasks.register('compileDesktopQtNativeTests') {
    group = 'verification'
    description = 'Builds matching baseline native fixtures for exact-artifact system-runtime CI (never packaged).'
    onlyIf { linux }
    dependsOn(compileQt)
