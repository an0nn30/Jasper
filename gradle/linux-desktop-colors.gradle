// Each compatibility target owns its CMake cache and SDK search path. In particular,
// generic Qt6 (6.2) must never inherit the KDE6 Qt SDK (6.5).
def qtCompatibilityTargets = [
    qt5: [major: 5, kind: 'qt', prefixes: ['jasper.qt5Prefix']],
    qt6: [major: 6, kind: 'qt', prefixes: ['jasper.qt6Prefix']],
    kde5: [major: 5, kind: 'kde', prefixes: ['jasper.kf5Prefix', 'jasper.qt5Prefix']],
    kde6: [major: 6, kind: 'kde', prefixes: ['jasper.kf6Prefix', 'jasper.kde6QtPrefix']]
]
def invokeDesktopQt = { List arguments ->
    providers.exec {
        ignoreExitValue = true
        environment('CMAKE_PREFIX_PATH', '')
        environment('QT_PLUGIN_PATH', '')
        environment('QT_QPA_PLATFORM_PLUGIN_PATH', '')
        environment('LD_LIBRARY_PATH', '')
        commandLine(arguments)
    }.with { execution ->
        logger.lifecycle(execution.standardOutput.asText.get())
        String errors = execution.standardError.asText.get()
        if (!errors.isBlank()) logger.lifecycle(errors)
        execution.result.get().assertNormalExitValue()
    }
}
def buildDesktopQt = { String name, boolean tests ->
    def target = qtCompatibilityTargets[name]
    def prefixes = target.prefixes.collect { property ->
        String value = providers.gradleProperty(property).orNull
        if (value != null && (!new File(value).isAbsolute() || !new File(value).isDirectory()))
            throw new GradleException("${property} must name an existing absolute SDK prefix: ${value}")
        value
    }.findAll { it != null }
    File build = layout.buildDirectory.dir("desktop-colors/cmake/${name}").get().asFile
    invokeDesktopQt(['cmake', '-S', source.parentFile.absolutePath, '-B', build.absolutePath,
        '-UQt5*', '-UQt6*', '-UQT_FEATURE_*', '-UKF5*', '-UKF6*', '-UECM_DIR', '-UDC_HAVE_KCOLORSCHEME_HEADER',
        '-DDC_QT_MAJOR=' + target.major, '-DDC_PROBE_KIND=' + target.kind,
        '-DDC_BUILD_TESTS=' + (tests ? 'ON' : 'OFF'), '-DDC_OPTIONAL_SDK=ON', '-DCMAKE_BUILD_TYPE=Release',
        '-DCMAKE_PREFIX_PATH=' + prefixes.join(';')] +
        (providers.gradleProperty('jasper.python').present ?
            ['-DPython3_EXECUTABLE=' + providers.gradleProperty('jasper.python').get()] : []))
    String status = new File(build, 'desktop-sdk-status.txt').text.trim()
    if (status.startsWith('missing: ')) {
        delete(new File(build, 'production'))
        skipOptional(name, status.substring('missing: '.length()))
        return null
    }
    if (status != 'available') throw new GradleException("Invalid desktop SDK discovery result for ${name}: ${status}")
    invokeDesktopQt(['cmake', '--build', build.absolutePath, '--parallel', '2'])
    Set names = new File(build, 'production').listFiles().collect { it.name } as Set
    if (names != ["jasper-desktop-${name}".toString()] as Set)
        throw new GradleException("Unexpected ${name} production files: ${names}")
    build
}
def compileQt = tasks.register('compileDesktopQtHelpers') {
    group = 'build'
    description = 'Builds available Qt/KDE helpers; only missing optional SDKs may be skipped.'
    onlyIf { linux }
    // SDK contents may change at the same prefix, including installed system SDKs.
    // Let CMake reconfigure and check its own incremental header/library dependencies.
    outputs.upToDateWhen { false }
    inputs.dir(source)
    inputs.file(rootProject.file('packaging/desktop-colors/CMakeLists.txt'))
    qtCompatibilityTargets.each { name, target ->
        target.prefixes.each { property -> inputs.property(property, providers.gradleProperty(property).getOrElse('system')) }
        outputs.file(layout.buildDirectory.file("desktop-colors/cmake/${name}/production/jasper-desktop-${name}"))
    }
    doLast {
        selectedQt.clear()
        qtCompatibilityTargets.keySet().each { name ->
            if (integrationModes[name] == 'off') {
                delete(layout.buildDirectory.dir("desktop-colors/cmake/${name}/production"))
                logger.lifecycle("Desktop integration ${name}: off")
            } else if (!compatibleCmake()) {
                delete(layout.buildDirectory.dir("desktop-colors/cmake/${name}/production"))
                skipOptional(name, 'CMake 3.21+ is unavailable (missing or older version)')
            } else if (buildDesktopQt(name, false) != null) selectedQt.add(name)
        }
    }
}
