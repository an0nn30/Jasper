// Linux helper targets need a C11 compiler; the portal additionally uses GIO.
def linux = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('linux')
def source = rootProject.file('packaging/desktop-colors/src')
def fixtures = rootProject.file('packaging/desktop-colors/test')
// Options are validated even on non-Linux hosts; discovery stays inside Linux task actions.
def integrationNames = ['gtk3', 'gtk4', 'qt5', 'qt6', 'kde5', 'kde6']
def strictValue = providers.gradleProperty('jasper.desktop.strict').getOrElse('false')
if (!(strictValue in ['true', 'false'])) throw new GradleException('jasper.desktop.strict must be true or false')
def desktopStrict = strictValue == 'true'
def integrationModes = integrationNames.collectEntries { name ->
    def value = providers.gradleProperty("jasper.desktop.${name}").getOrElse('auto')
    if (!(value in ['auto', 'off', 'required']))
        throw new GradleException("jasper.desktop.${name} must be auto, off or required: ${value}")
    if (desktopStrict && value == 'off')
        throw new GradleException("jasper.desktop.strict=true conflicts with jasper.desktop.${name}=off")
    [(name): desktopStrict ? 'required' : value]
}
def selectedHelpers = layout.buildDirectory.file('desktop-colors/selected-helpers.txt')
// Packaging consumes the same selection as staging, never a directory scan that could bless stale files.
ext.desktopHelperManifest = selectedHelpers
ext.desktopHelperNames = { selectedHelpers.get().asFile.readLines().findAll { !it.isBlank() } }
def hasCommand = { String name ->
    (System.getenv('PATH') ?: '').split(File.pathSeparator).any { new File(it, name).canExecute() }
}
def cmakeSupported = null
def compatibleCmake = {
    if (cmakeSupported == null) {
        cmakeSupported = false
        if (hasCommand('cmake')) {
            def version = providers.exec { commandLine('cmake', '--version') }.standardOutput.asText.get() =~ /cmake version (\d+)\.(\d+)/
            if (!version.find()) throw new GradleException('Cannot determine desktop CMake version')
            cmakeSupported = version.group(1).toInteger() > 3 || (version.group(1) == '3' && version.group(2).toInteger() >= 21)
        }
    }
    cmakeSupported
}
def skipOptional = { String name, String reason ->
    if (integrationModes[name] == 'required') throw new GradleException("Required desktop integration ${name}: ${reason}")
    logger.warn("Skipping desktop integration ${name}: ${reason}")
}
def gtkPackages = [3: ['gtk+-3.0 >= 3.24'], 4: ['gtk4 >= 4.10', 'libadwaita-1']]
def gtkTestAvailable = { int major ->
    if (integrationModes["gtk${major}".toString()] == 'off') return false
    def available = hasCommand('pkg-config') && providers.exec {
        ignoreExitValue = true
        commandLine(['pkg-config', '--exists'] + gtkPackages[major])
    }.result.get().exitValue == 0
    if (!available) skipOptional("gtk${major}".toString(), "native ABI/tests need ${gtkPackages[major].join(', ')} development packages (production needs only GIO)")
    available
}
def displayTestsAvailable = { String name ->
    def missing = ['xvfb-run', 'Xvfb', 'xauth', 'dbus-run-session'].findAll { !hasCommand(it) }
    if (!missing.empty) skipOptional(name, "native tests need ${missing.join(', ')}")
    if (!missing.empty) return false
    def locales = hasCommand('locale') ? providers.exec { commandLine('locale', '-a') }.standardOutput.asText.get().toLowerCase(Locale.ROOT).replace('-', '') : ''
    if (!(locales.contains('de_de.utf8') || locales.contains('de_de.utf_8'))) {
        skipOptional(name, 'native tests need the de_DE.UTF-8 decimal-comma locale')
        return false
    }
    true
}
def qtTestsAvailable = { String name, boolean display ->
    String python = providers.gradleProperty('jasper.python').getOrElse('python3')
    if (!(new File(python).isAbsolute() ? new File(python).canExecute() : hasCommand(python))) {
        skipOptional(name, "native tests need Python 3 (${python})")
        return false
    }
    !display || displayTestsAvailable(name)
}
