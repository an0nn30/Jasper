# Jasper-authored terminal palette matched to the upstream editor colors.
name = "Studio Dark"
extends = "Xcode Dark"
[colors]
background = "#292a2f"
foreground = "#ffffff"
cursor = "#ffffff"
selection = "#515b70"
[colors.normal]
black = "#292a2f"
red = "#fc5fa3"
green = "#67b7a4"
yellow = "#fd8f3f"
blue = "#78acef"
magenta = "#d0a8ff"
cyan = "#5dd8ff"
white = "#ffffff"
[colors.bright]
black = "#6c7986"
red = "#ff7eb6"
green = "#8fd9bd"
yellow = "#ffb066"
blue = "#9ac3ff"
magenta = "#dfc0ff"
cyan = "#8ae5ff"
white = "#ffffff"
